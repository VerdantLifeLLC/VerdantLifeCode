<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Lexington: The Turnaround</title>
  <meta name="description" content="An illustrated comic about Lexington, a brilliant 13-year-old who keeps making bad choices, until faith, determination and a lot of practice turn his life around." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&family=Lora:ital,wght@0,500;1,500&family=Patrick+Hand&display=swap" />
  <style>
/* Layout: a centred reading column of comic pages on a newsprint-blue table;
   in panel mode each panel stacks full width for phones. */
:root {
  --bg: #dfe5ee;
  --bg-2: #cfd7e4;
  --fg: #1f1a2b;
  --muted: #5a5670;
  --accent: #c9473c;
  --gold: #ffd95e;
  --card: #fffaf0;
  --line: #1f1a2b;
  --shadow: rgba(31, 26, 43, 0.28);
  --display: "Bangers", Impact, "Arial Black", sans-serif;
  --body: "Comic Neue", "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141824;
    --bg-2: #1d2333;
    --fg: #eee7da;
    --muted: #a9a3b8;
    --accent: #ef6b5a;
    --gold: #ffd95e;
    --card: #fffaf0;
    --line: #0b0d14;
    --shadow: rgba(0, 0, 0, 0.55);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141824;
  --bg-2: #1d2333;
  --fg: #eee7da;
  --muted: #a9a3b8;
  --accent: #ef6b5a;
  --gold: #ffd95e;
  --card: #fffaf0;
  --line: #0b0d14;
  --shadow: rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  background-image: radial-gradient(var(--bg-2) 1.2px, transparent 1.4px);
  background-size: 14px 14px;
  color: var(--fg);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
  padding-inline: 16px;
}

.masthead {
  max-width: 980px;
  margin: 0 auto;
  padding-block: 22px 14px;
  display: flex;
  flex-wrap: wrap;
  align-items: end;
  justify-content: space-between;
  gap: 14px 24px;
}
.brand { min-width: 0; }
.kicker {
  margin: 0;
  font-family: var(--display);
  letter-spacing: 0.08em;
  color: var(--muted);
  font-size: 1rem;
}
h1 {
  margin: 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(2.6rem, 8vw, 4.2rem);
  line-height: 0.9;
  letter-spacing: 0.03em;
  color: var(--accent);
  text-shadow: 3px 3px 0 var(--line);
  -webkit-text-stroke: 1.5px var(--line);
  text-wrap: balance;
}
h1 span {
  display: block;
  font-size: 0.42em;
  color: var(--fg);
  -webkit-text-stroke: 0;
  text-shadow: none;
  letter-spacing: 0.12em;
  margin-top: 6px;
}

.tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
.seg {
  display: inline-flex;
  border: 2.5px solid var(--line);
  border-radius: 999px;
  overflow: hidden;
  background: var(--card);
  box-shadow: 3px 3px 0 var(--line);
}
.seg button {
  font: 700 0.95rem var(--body);
  border: 0;
  background: transparent;
  color: #1f1a2b;
  padding: 7px 14px;
  cursor: pointer;
}
.seg button[aria-pressed="true"] { background: var(--gold); }
.seg button + button { border-left: 2.5px solid var(--line); }
.jump {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-weight: 700;
}
.jump select {
  font: 700 0.95rem var(--body);
  border: 2.5px solid var(--line);
  border-radius: 10px;
  padding: 6px 8px;
  background: var(--card);
  color: #1f1a2b;
  max-width: 62vw;
  box-shadow: 3px 3px 0 var(--line);
}
button:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 3px solid var(--accent);
  outline-offset: 2px;
}

.look { position: relative; }
.look summary {
  list-style: none;
  cursor: pointer;
  font-weight: 700;
  border: 2.5px solid var(--line);
  border-radius: 999px;
  padding: 7px 14px;
  background: var(--card);
  color: #1f1a2b;
  box-shadow: 3px 3px 0 var(--line);
}
.look summary::-webkit-details-marker { display: none; }
.look-body {
  position: absolute;
  right: 0;
  z-index: 5;
  margin-top: 10px;
  width: min(300px, calc(100vw - 32px));
  background: var(--card);
  color: #1f1a2b;
  border: 2.5px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  box-shadow: 5px 5px 0 var(--line);
}
.look-body p { margin: 0 0 8px; font-size: 0.92rem; }
.look-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
.look-row > span { width: 38px; font-weight: 700; font-size: 0.9rem; }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 2.5px solid #1f1a2b;
  background: var(--sw);
  cursor: pointer;
  padding: 0;
}
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--card), 0 0 0 6px var(--accent); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.book {
  max-width: 900px;
  margin: 0 auto;
  padding-block: 10px 40px;
  display: grid;
  gap: 34px;
}
.loading {
  text-align: center;
  font-family: var(--display);
  font-size: 1.6rem;
  letter-spacing: 0.05em;
  color: var(--muted);
  padding-block: 120px;
}
.page {
  margin: 0;
  background: #fffaf0;
  box-shadow: 0 2px 0 var(--line), 8px 10px 0 var(--shadow);
  border-radius: 3px;
  overflow: hidden;
  scroll-margin-top: 12px;
}
.page-svg, .panel-svg {
  display: block;
  width: 100%;
  height: auto;
  max-width: 100%;
}

/* panel-by-panel mode */
.book[data-view="panels"] { max-width: 640px; gap: 26px; }
.book[data-view="panels"] .page.full { max-width: 100%; }
.strip { display: grid; gap: 14px; scroll-margin-top: 12px; }
.strip-title {
  margin: 10px 0 0;
  font-family: var(--display);
  font-weight: 400;
  font-size: clamp(1.8rem, 7vw, 2.4rem);
  line-height: 1;
  color: var(--accent);
  -webkit-text-stroke: 1px var(--line);
  text-shadow: 2px 2px 0 var(--line);
  letter-spacing: 0.04em;
  text-wrap: balance;
}
.strip-title span {
  display: block;
  font-size: 0.5em;
  color: var(--muted);
  -webkit-text-stroke: 0;
  text-shadow: none;
  letter-spacing: 0.14em;
}
.panel {
  margin: 0;
  background: #fff;
  box-shadow: 6px 7px 0 var(--shadow);
}

.colophon {
  max-width: 900px;
  margin: 0 auto;
  padding-block: 0 40px;
  text-align: center;
  color: var(--muted);
  font-size: 0.95rem;
}

/* print / PDF export: one comic page per sheet */
html.print body { background: #fff; padding: 0; }
html.print .masthead, html.print .colophon { display: none; }
html.print .book { max-width: none; padding: 0; gap: 0; display: block; }
html.print .page { width: 7in; height: 10.5in; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
html.print .page-svg { width: 7in; height: 10.5in; }
@page { margin: 0; }

@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}
</style>
</head>
<body>
  <header class="masthead">
    <div class="brand">
      <p class="kicker">Issue #1 · A Verdant Life comic</p>
      <h1>Lexington <span>The Turnaround</span></h1>
    </div>
    <nav class="tools" aria-label="Reader settings">
      <div class="seg" id="view-toggle" role="group" aria-label="Reading mode">
        <button type="button" data-view="pages">Full pages</button>
        <button type="button" data-view="panels">Panel by panel</button>
      </div>
      <label class="jump">Go to
        <select id="jump"></select>
      </label>
      <details class="look">
        <summary>Lexington's look</summary>
        <div class="look-body">
          <p>Match the family's skin tone and hair color. Every page redraws.</p>
          <div class="look-row"><span>Skin</span><div id="skin-swatches" class="swatches"></div></div>
          <div class="look-row"><span>Hair</span><div id="hair-swatches" class="swatches"></div></div>
        </div>
      </details>
    </nav>
  </header>

  <main id="book" class="book" aria-label="Comic pages">
    <p class="loading">Inking the pages…</p>
  </main>

  <footer class="colophon">
    <p>Written and illustrated for Lexington. Scripture quoted from the King James Version.</p>
  </footer>

  <script>
/* Lexington: The Turnaround — drawing core.
   Shared palette, small SVG helpers, global pattern defs and comic lettering
   (speech balloons, captions, sound effects). Everything returns SVG strings. */
(function () {
  "use strict";
  const C = (window.Comic = window.Comic || {});

  C.INK = "#1f1a2b";
  C.SW = 3;
  C.PAPER = "#fffaf0";
  C.FONTS = {
    letter: "'Comic Neue', 'Comic Sans MS', 'Chalkboard SE', sans-serif",
    title: "'Bangers', 'Impact', 'Arial Black', sans-serif",
    hand: "'Patrick Hand', 'Comic Neue', 'Comic Sans MS', cursive",
    verse: "'Lora', Georgia, 'Times New Roman', serif",
  };

  // Lexington's look can be changed from the reader toolbar.
  C.SKINS = {
    deep: { skin: "#5b3a27", shade: "#472c1d", label: "Deep" },
    brown: { skin: "#8a5a3c", shade: "#6e452d", label: "Brown" },
    tan: { skin: "#c48d61", shade: "#a6714b", label: "Tan" },
    light: { skin: "#eec3a0", shade: "#d6a37e", label: "Light" },
    fair: { skin: "#f7dccb", shade: "#e6bba3", label: "Fair" },
  };
  C.HAIRS = {
    black: { hair: "#231815", label: "Black" },
    brown: { hair: "#5a3620", label: "Brown" },
    auburn: { hair: "#8c3f22", label: "Auburn" },
    blond: { hair: "#c99a4b", label: "Blond" },
  };
  C.family = { skin: "brown", hair: "black" };
  C.famSkin = () => C.SKINS[C.family.skin] || C.SKINS.brown;
  C.famHair = () => (C.HAIRS[C.family.hair] || C.HAIRS.black).hair;

  // ---------- number + path helpers ----------
  const n = (v) => Math.round(v * 10) / 10;
  C.n = n;
  C.pt = (p) => n(p[0]) + " " + n(p[1]);
  C.esc = (s) =>
    String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  // Seeded random so drawings look hand-made but stay identical every render.
  C.rng = function (seed) {
    let s = (seed * 9301 + 49297) % 233280 || 1;
    return () => {
      s = (s * 9301 + 49297) % 233280;
      return s / 233280;
    };
  };

  C.path = (d, fill, o = {}) =>
    `<path d="${d}" fill="${fill || "none"}" stroke="${o.stroke || C.INK}" stroke-width="${
      o.sw ?? C.SW
    }" stroke-linejoin="round" stroke-linecap="round"${o.op != null ? ` opacity="${o.op}"` : ""}${
      o.dash ? ` stroke-dasharray="${o.dash}"` : ""
    }${o.extra || ""}/>`;
  C.fillPath = (d, fill, op) =>
    `<path d="${d}" fill="${fill}" stroke="none"${op != null ? ` opacity="${op}"` : ""}/>`;
  C.rect = (x, y, w, h, fill, o = {}) =>
    `<rect x="${n(x)}" y="${n(y)}" width="${n(Math.max(0, w))}" height="${n(Math.max(0, h))}" rx="${o.r || 0}" fill="${fill || "none"}" stroke="${
      o.stroke || C.INK
    }" stroke-width="${o.sw ?? C.SW}" stroke-linejoin="round"${o.op != null ? ` opacity="${o.op}"` : ""}${
      o.dash ? ` stroke-dasharray="${o.dash}"` : ""
    }/>`;
  C.frect = (x, y, w, h, fill, op, r) =>
    `<rect x="${n(x)}" y="${n(y)}" width="${n(Math.max(0, w))}" height="${n(Math.max(0, h))}"${r ? ` rx="${r}"` : ""} fill="${fill}"${
      op != null ? ` opacity="${op}"` : ""
    }/>`;
  C.circle = (x, y, r, fill, o = {}) =>
    `<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${fill || "none"}" stroke="${o.stroke || C.INK}" stroke-width="${
      o.sw ?? C.SW
    }"${o.op != null ? ` opacity="${o.op}"` : ""}/>`;
  C.fcircle = (x, y, r, fill, op) =>
    `<circle cx="${n(x)}" cy="${n(y)}" r="${n(r)}" fill="${fill}"${op != null ? ` opacity="${op}"` : ""}/>`;
  C.ellipse = (x, y, rx, ry, fill, o = {}) =>
    `<ellipse cx="${n(x)}" cy="${n(y)}" rx="${n(rx)}" ry="${n(ry)}" fill="${fill || "none"}" stroke="${
      o.stroke || C.INK
    }" stroke-width="${o.sw ?? C.SW}"${o.op != null ? ` opacity="${o.op}"` : ""}${
      o.rot ? ` transform="rotate(${o.rot} ${n(x)} ${n(y)})"` : ""
    }/>`;
  C.fellipse = (x, y, rx, ry, fill, op, rot) =>
    `<ellipse cx="${n(x)}" cy="${n(y)}" rx="${n(rx)}" ry="${n(ry)}" fill="${fill}"${op != null ? ` opacity="${op}"` : ""}${
      rot ? ` transform="rotate(${rot} ${n(x)} ${n(y)})"` : ""
    }/>`;
  C.line = (x1, y1, x2, y2, o = {}) =>
    `<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}" stroke="${o.stroke || C.INK}" stroke-width="${
      o.sw ?? C.SW
    }" stroke-linecap="round"${o.op != null ? ` opacity="${o.op}"` : ""}${o.dash ? ` stroke-dasharray="${o.dash}"` : ""}/>`;
  C.poly = (pts, fill, o = {}) => C.path("M" + pts.map(C.pt).join(" L") + " Z", fill, o);
  C.g = (inner, tf, extra) => `<g${tf ? ` transform="${tf}"` : ""}${extra || ""}>${inner}</g>`;
  C.text = (x, y, str, o = {}) => {
    const size = o.size || 20;
    const fam = C.FONTS[o.font || "letter"] || o.font;
    const attrs = [
      `x="${n(x)}"`,
      `y="${n(y)}"`,
      `font-family="${fam.replace(/"/g, "'")}"`,
      `font-size="${size}"`,
      `font-weight="${o.weight || 700}"`,
      `fill="${o.fill || C.INK}"`,
      `text-anchor="${o.anchor || "middle"}"`,
    ];
    if (o.italic) attrs.push('font-style="italic"');
    if (o.ls) attrs.push(`letter-spacing="${o.ls}"`);
    if (o.stroke) attrs.push(`stroke="${o.stroke}" stroke-width="${o.sw || 4}" paint-order="stroke" stroke-linejoin="round"`);
    if (o.rot) attrs.push(`transform="rotate(${o.rot} ${n(x)} ${n(y)})"`);
    if (o.op != null) attrs.push(`opacity="${o.op}"`);
    const lines = String(str).split("\n");
    if (lines.length === 1) return `<text ${attrs.join(" ")}>${C.esc(str)}</text>`;
    const lh = o.lh || size * 1.15;
    return `<text ${attrs.join(" ")}>${lines
      .map((l, i) => `<tspan x="${n(x)}" dy="${i === 0 ? 0 : lh}">${C.esc(l)}</tspan>`)
      .join("")}</text>`;
  };

  // Shade a hex colour: amt < 0 darkens, amt > 0 lightens.
  C.shade = function (hex, amt) {
    const h = hex.replace("#", "");
    const r = parseInt(h.slice(0, 2), 16),
      g = parseInt(h.slice(2, 4), 16),
      b = parseInt(h.slice(4, 6), 16);
    const f = (c) => {
      const v = amt < 0 ? c * (1 + amt) : c + (255 - c) * amt;
      return Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, "0");
    };
    return "#" + f(r) + f(g) + f(b);
  };

  // ---------- global defs (patterns, gradients) ----------
  C.defs = function () {
    return `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
      <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="4.5" cy="4.5" r="1.7" fill="${C.INK}" opacity=".28"/></pattern>
      <pattern id="dotsFine" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1.1" fill="${C.INK}" opacity=".22"/></pattern>
      <pattern id="dotsWhite" width="10" height="10" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="1.8" fill="#fff" opacity=".35"/></pattern>
      <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="${C.INK}" stroke-width="1.6" opacity=".22"/></pattern>
      <pattern id="tiles" width="40" height="40" patternUnits="userSpaceOnUse"><rect width="40" height="40" fill="#cfe6ec"/><rect x="1" y="1" width="38" height="38" fill="#dff0f3"/></pattern>
      <pattern id="planks" width="160" height="34" patternUnits="userSpaceOnUse"><rect width="160" height="34" fill="#b9814f"/><line x1="0" y1="33" x2="160" y2="33" stroke="#8d5d36" stroke-width="2"/><line x1="70" y1="0" x2="70" y2="33" stroke="#8d5d36" stroke-width="2"/></pattern>
      <pattern id="carpet" width="12" height="12" patternUnits="userSpaceOnUse"><rect width="12" height="12" fill="#7d8fb3"/><circle cx="3" cy="3" r="1.2" fill="#6b7da1"/><circle cx="9" cy="9" r="1.2" fill="#6b7da1"/></pattern>
      <pattern id="brick" width="60" height="30" patternUnits="userSpaceOnUse"><rect width="60" height="30" fill="#b5543f"/><path d="M0 15 H60 M30 0 V15 M0 15 V30 M60 15 V30" stroke="#8e3d2c" stroke-width="2"/></pattern>
      <pattern id="siding" width="40" height="22" patternUnits="userSpaceOnUse"><rect width="40" height="22" fill="#e9dcc2"/><line x1="0" y1="21" x2="40" y2="21" stroke="#c9b897" stroke-width="2"/></pattern>
      <pattern id="grass" width="24" height="16" patternUnits="userSpaceOnUse"><rect width="24" height="16" fill="#69a94f"/><path d="M4 16 l2 -6 l2 6 M14 16 l2 -7 l2 7" stroke="#57913f" stroke-width="2" fill="none"/></pattern>
      <pattern id="pegboard" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#c9a77a"/><circle cx="8" cy="8" r="1.8" fill="#8a6a43"/></pattern>
      <pattern id="lined" width="200" height="22" patternUnits="userSpaceOnUse"><rect width="200" height="22" fill="#fffdf4"/><line x1="0" y1="21" x2="200" y2="21" stroke="#9fc3e6" stroke-width="1.4"/></pattern>
      <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6fb8ec"/><stop offset="1" stop-color="#cfeaf9"/></linearGradient>
      <linearGradient id="skyDusk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3a74"/><stop offset=".6" stop-color="#b8607a"/><stop offset="1" stop-color="#f3a768"/></linearGradient>
      <linearGradient id="skySunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a5a"/><stop offset=".55" stop-color="#ffcf6e"/><stop offset="1" stop-color="#fff0b8"/></linearGradient>
      <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f1638"/><stop offset="1" stop-color="#2b3a73"/></linearGradient>
      <linearGradient id="skyDawn" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb9e8"/><stop offset=".7" stop-color="#ffd9a8"/><stop offset="1" stop-color="#ffefd2"/></linearGradient>
      <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6c8" stop-opacity=".95"/><stop offset=".55" stop-color="#ffe58a" stop-opacity=".45"/><stop offset="1" stop-color="#ffd84a" stop-opacity="0"/></radialGradient>
      <radialGradient id="moonGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#e8f0ff" stop-opacity=".85"/><stop offset="1" stop-color="#b9c9ff" stop-opacity="0"/></radialGradient>
      <radialGradient id="lampGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff2b0" stop-opacity=".9"/><stop offset="1" stop-color="#ffd760" stop-opacity="0"/></radialGradient>
      <radialGradient id="screenGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9fe8ff" stop-opacity=".75"/><stop offset="1" stop-color="#4fc3ff" stop-opacity="0"/></radialGradient>
      <filter id="desat"><feColorMatrix type="saturate" values="0.12"/></filter>
      <filter id="sepia"><feColorMatrix type="matrix" values="0.39 0.77 0.19 0 0.04  0.35 0.69 0.17 0 0.02  0.27 0.53 0.13 0 0  0 0 0 1 0"/></filter>
      <radialGradient id="vignette" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".45"/></radialGradient>
    </defs></svg>`;
  };

  // ---------- lettering ----------
  let ctx = null;
  function measure(str, size, weight, fam, italic) {
    if (!ctx) ctx = document.createElement("canvas").getContext("2d");
    ctx.font = `${italic ? "italic " : ""}${weight} ${size}px ${fam}`;
    return ctx.measureText(str).width;
  }
  C.measure = measure;

  // Greedy word wrap. Text may carry **emphasis** markers; widths are measured
  // without them and a marker split across lines is closed and reopened.

      x + w

  function tailPath(cx, cy, tx, ty, base, curve) {

      dy = ty - cy;

    const ux = dx / len,
      uy = dy / len;
    const px = -uy,
      py = ux;

    const b2 = [cx - px * base, cy - py * base];
    const m = [cx + dx * 0.55 + px * curve, cy + dy * 0.55 + py * curve];
    return `M${C.pt(b1)} Q${C.pt(m)} ${n(tx)} ${n(ty)} Q${C.pt([m[0] - px * base * 0.5, m[1] - py * base * 0.5])} ${C.pt(b2)} Z`;

  function burstPath(cx, cy, rx, ry, spikes, seed) {
    const r = C.rng(seed || 7);
    const pts = [];
    const N = spikes * 2;
    for (let i = 0; i < N; i++) {
      const t = (i / N) * Math.PI * 2;
      const out = i % 2 === 0 ? 1.18 + r() * 0.16 : 0.92;
      pts.push([cx + Math.cos(t) * rx * out, cy + Math.sin(t) * ry * out]);
    }
    return "M" + pts.map(C.pt).join(" L") + " Z";
  }

  function cloudPath(cx, cy, rx, ry, bumps) {
    let d = "";
    const N = bumps;
    const pts = [];
    for (let i = 0; i < N; i++) {
      const t = (i / N) * Math.PI * 2;
      pts.push([cx + Math.cos(t) * rx, cy + Math.sin(t) * ry]);
    }
    d = "M" + C.pt(pts[0]);
    for (let i = 0; i < N; i++) {
      const a = pts[i],
        b = pts[(i + 1) % N];
      const mx = (a[0] + b[0]) / 2,
        my = (a[1] + b[1]) / 2;
      const ox = mx - cx,
        oy = my - cy;
      const ol = Math.hypot(ox, oy) || 1;
      const bulge = Math.hypot(b[0] - a[0], b[1] - a[1]) * 0.55;
      d += ` Q${n(mx + (ox / ol) * bulge)} ${n(my + (oy / ol) * bulge)} ${C.pt(b)}`;
    }

  /* Balloon spec:
     { t: text, x, y (centre), w: max text width, k: kind, tail: [x,y] | [[x,y],...],

    const weight = kind === "verse" ? 500 : kind === "note" ? 400 : 700;

    const upper = !isCap && kind !== "pray" && !b.lower;

    const lines = marked.map(plain);
    const lh = size * (kind === "verse" ? 1.3 : 1.12);
    const tw = Math.max(b.minW || 0, ...lines.map((l) => measure(l, size, weight, fam, italic)));
    const th = Math.max(b.minH || 0, lines.length * lh);
    const accent = b.accent || "#c2362b";
    let out = "";

    if (isCap) {
      const padX = kind === "verse" ? 18 : 14,
        padY = kind === "verse" ? 14 : 10;
      const w = (b.fixedW || tw) + padX * 2,
        h = th + padY * 2;
      const x = b.tl ? b.x : b.x - w / 2,
        y = b.tl ? b.y : b.y - h / 2;
      const bg = b.bg || (kind === "verse" ? "#fbf1d6" : kind === "note" ? "#fff8b8" : "#ffd95e");
      out += `<rect x="${n(x + 5)}" y="${n(y + 5)}" width="${n(w)}" height="${n(h)}" fill="${C.INK}" opacity=".9"/>`;
      out += C.rect(x, y, w, h, bg, { sw: 3 });
      if (kind === "verse") {
        out += C.rect(x + 6, y + 6, w - 12, h - 12, "none", { sw: 1.2, stroke: "#b08d4a" });
      }
      const anchor = b.align === "center" ? "middle" : "start";
      const tx = b.align === "center" ? x + w / 2 : x + padX;
      out += `<text font-family="${fam.replace(/"/g, "'")}" font-size="${size}" font-weight="${weight}"${
        italic ? ' font-style="italic"' : ""
      } fill="${b.color || C.INK}" text-anchor="${anchor}">`;
      marked.forEach((l, i) => {
        out += `<tspan x="${n(tx)}" y="${n(y + padY + size * 0.85 + i * lh)}">${tspans(l, accent)}</tspan>`;
      });
      out += `</text>`;
      return b.rot ? `<g transform="rotate(${b.rot} ${n(x + w / 2)} ${n(y + h / 2)})">${out}</g>` : out;
    }

    const padX = kind === "shout" ? 26 : kind === "think" ? 26 : 18;
    const padY = kind === "shout" ? 20 : kind === "think" ? 20 : 13;
    const rx = tw / 2 + padX,
      ry = th / 2 + padY;
    const cx = b.x,
      cy = b.y;
    const tails = !b.tail ? [] : Array.isArray(b.tail[0]) ? b.tail : [b.tail];
    const fill = b.bg || (kind === "pray" ? "#fff6d6" : "#ffffff");

    if (kind === "shout") shape = burstPath(cx, cy, rx * 1.12, ry * 1.18, Math.max(12, Math.round(rx / 11)), b.seed || 3);
    else if (kind === "think") shape = cloudPath(cx, cy, rx * 1.04, ry * 1.06, Math.max(9, Math.round((rx + ry) / 17)));
    else shape = ovalPath(cx, cy, rx * 1.06, ry * 1.1, lines.length > 2 ? 2.4 : 2.9, kind === "pray" ? 0 : 0);

    let tailsOut = "",
      tailsFill = "";
    tails.forEach((t) => {
      if (kind === "think") {
        const dx = t[0] - cx,
          dy = t[1] - cy;
        [0.62, 0.78, 0.92].forEach((f, i) => {
          tailsOut += C.circle(cx + dx * f, cy + dy * f, 11 - i * 3.3, fill, { sw: 2.6 });
        });
      } else {
        const base = kind === "shout" ? 12 : 10;
        const tp = tailPath(cx, cy, t[0], t[1], base, kind === "shout" ? 0 : (b.curve ?? 14));
        tailsOut += `<path d="${tp}" fill="${C.INK}" stroke="${C.INK}" stroke-width="6" stroke-linejoin="round"/>`;
        tailsFill += `<path d="${tp}" fill="${fill}"/>`;
      }
    });
    const dash = kind === "whisper" ? ' stroke-dasharray="7 6"' : "";
    if (kind === "pray") {
      out += `<path d="${shape}" fill="#ffe7a0" opacity=".55" transform="translate(${n(cx)} ${n(cy)}) scale(1.08) translate(${n(
        -cx
      )} ${n(-cy)})"/>`;
    }
    if (kind === "whisper") {
      out += tailsFill.replace(/fill="[^"]+"/g, `fill="${fill}" stroke="${C.INK}" stroke-width="2.4" stroke-dasharray="7 6"`);
      out += `<path d="${shape}" fill="${fill}" stroke="${C.INK}" stroke-width="2.6"${dash}/>`;
      out += tailsFill;
    } else if (kind === "think") {
      out += tailsOut;
      out += `<path d="${shape}" fill="${fill}" stroke="${C.INK}" stroke-width="3"/>`;
    } else {
      out += tailsOut;
      out += `<path d="${shape}" fill="${C.INK}" stroke="${C.INK}" stroke-width="6" stroke-linejoin="round"/>`;
      out += tailsFill;
      out += `<path d="${shape}" fill="${fill}"/>`;
    }
    out += `<text font-family="${fam.replace(/"/g, "'")}" font-size="${size}" font-weight="${weight}" fill="${
      b.color || C.INK
    }" text-anchor="middle">`;
    marked.forEach((l, i) => {
      out += `<tspan x="${n(cx)}" y="${n(cy - th / 2 + size * 0.86 + i * lh)}">${tspans(l, accent)}</tspan>`;
    });
    out += `</text>`;
    return out;
  };

  function sfx(b) {
    const size = b.size || 54;
    const fill = b.color || "#ffd23f";
    const stroke = b.stroke || C.INK;
    const rot = b.rot || -8;
    const fam = b.font ? C.FONTS[b.font] : C.FONTS.title;
    return `<g transform="rotate(${rot} ${n(b.x)} ${n(b.y)})"><text x="${n(b.x + 4)}" y="${n(b.y + 5)}" font-family="${fam.replace(
      /"/g,
      "'"
    )}" font-size="${size}" fill="${C.INK}" text-anchor="middle" letter-spacing="2" stroke="${C.INK}" stroke-width="${
      size / 6
    }" stroke-linejoin="round">${C.esc(b.t)}</text><text x="${n(b.x)}" y="${n(b.y)}" font-family="${fam.replace(
      /"/g,
      "'"
    )}" font-size="${size}" fill="${fill}" text-anchor="middle" letter-spacing="2" stroke="${stroke}" stroke-width="${
      size / 9
    }" paint-order="stroke" stroke-linejoin="round">${C.esc(b.t)}</text></g>`;
  }
})();

    focus: { eyes: "open", brows: "determined", mouth: "tongueSide", gaze: [3, 3] },
    sly: { eyes: "half", brows: "angry", mouth: "smirk" },
    dazed: { eyes: "spiral", brows: "up", mouth: "wavy" },
    blank: { eyes: "dots", brows: "neutral", mouth: "flat" },
    surprised: { eyes: "wide", brows: "up", mouth: "smile" },
    wince: { eyes: "squint", brows: "worry", mouth: "gritted", extras: ["sweat"] },
    hopeful: { eyes: "teary", brows: "up", mouth: "smile" },
    confident: { eyes: "open", brows: "raise1", mouth: "grin", extras: ["shine"] },
  };
  C.EXPR = EXPR;

  function face(B, cfg, ex, o) {
    const r = B.r,
      hc = B.hcy,
      k = r / 40;
    const look = 5 * k;
    const es = B.eye * (cfg.eyeScale || 1);
    const gz = o.gaze || ex.gaze || [2, 0];
    const ey = hc + 2 * k;
    const ex1 = look - 15 * k,
      ex2 = look + 15 * k;
    const erx = 6.6 * k * es,
      ery = 8.6 * k * es;
    const skin = cfg.skin,
      skinShade = cfg.shade;
    const iris = cfg.iris || "#3b2618";
    let s = "";
    const extras = ex.extras || [];

    if (extras.includes("green")) s += `<path d="${headPath(r, hc, cfg.jaw || 1)}" fill="#8dc26b" opacity=".38"/>`;
    if (extras.includes("blush") || o.blush) {
      s += fellipse(ex1 - 4 * k, ey + 13 * k, 7 * k, 3.6 * k, "#e8536b", 0.45);
      s += fellipse(ex2 + 3 * k, ey + 13 * k, 7 * k, 3.6 * k, "#e8536b", 0.45);
    }

    const eye = (x, which) => {
      const kind = ex.eyes;
      if (kind === "closed") return path(`M${n(x - erx)} ${n(ey)} Q${n(x)} ${n(ey + ery * 0.75)} ${n(x + erx)} ${n(ey)}`, "none", { sw: 2.6 });
      if (kind === "closedTight")
        return path(`M${n(x - erx)} ${n(ey - 2 * k)} Q${n(x)} ${n(ey + ery * 0.5)} ${n(x + erx)} ${n(ey - 2 * k)} M${n(x - erx * 0.7)} ${n(ey + 3 * k)} L${n(x + erx * 0.7)} ${n(ey + 2 * k)}`, "none", { sw: 2.4 });
      if (kind === "happy") return path(`M${n(x - erx)} ${n(ey + 2 * k)} Q${n(x)} ${n(ey - ery * 1.1)} ${n(x + erx)} ${n(ey + 2 * k)}`, "none", { sw: 2.8 });
      if (kind === "squint") {
        const d = which === 1 ? 1 : -1;
        return path(`M${n(x - erx * d)} ${n(ey - ery * 0.6)} L${n(x + erx * d)} ${n(ey)} L${n(x - erx * d)} ${n(ey + ery * 0.6)}`, "none", { sw: 2.8 });
      }
      if (kind === "tight") return line(x - erx, ey, x + erx, ey, { sw: 3 });
      if (kind === "dots") return fcircle(x + gz[0] * 0.4, ey + gz[1] * 0.4, 2.8 * k, INK);
      if (kind === "spiral")
        return path(`M${n(x)} ${n(ey)} m-1 0 a2 2 0 1 1 3 1 a4 4 0 1 1 -6 -2 a6 6 0 1 1 9 4`, "none", { sw: 1.8 });
      const big = kind === "wide" ? 1.3 : 1;
      const rx = erx * big,
        ry = ery * big;
      let e = ellipse(x, ey, rx, ry, "#fff", { sw: 2.4 });
      const pr = (kind === "wide" ? 3.2 : 4.4) * k * es;
      const px = x + gz[0] * 0.7 * k,
        py = ey + gz[1] * 0.7 * k + (kind === "sleepy" || kind === "half" ? 2 * k : 0);
      e += fcircle(px, py, pr, iris) + fcircle(px, py, pr * 0.55, "#120b08");
      e += fcircle(px + pr * 0.45, py - pr * 0.5, pr * 0.38, "#fff");
      if (kind === "teary") {
        e += fcircle(px - pr * 0.4, py + pr * 0.35, pr * 0.25, "#fff");
        e += path(`M${n(x - rx * 0.9)} ${n(ey + ry * 0.55)} Q${n(x)} ${n(ey + ry * 1.05)} ${n(x + rx * 0.9)} ${n(ey + ry * 0.55)}`, "#9fd8ff", { sw: 1.6, stroke: "#4c9fd6" });
      }
      if (kind === "half" || kind === "sleepy") {
        const lidY = ey - ry + ry * (kind === "sleepy" ? 1.15 : 0.95);
        e += `<path d="M${n(x - rx - 1)} ${n(ey - ry - 2)} L${n(x + rx + 1)} ${n(ey - ry - 2)} L${n(x + rx + 1)} ${n(lidY)} L${n(x - rx - 1)} ${n(lidY)} Z" fill="${skin}"/>`;
        e += line(x - rx - 1, lidY, x + rx + 1, lidY, { sw: 2.6 });
      }
      return e;
    };
    s += eye(ex1, 1) + eye(ex2, 2);

    // brows
    const bw = 8 * k,
      by = ey - 14 * k * (ex.eyes === "wide" ? 1.15 : 1);
    const brow = (x, side) => {
      let a = 0,
        dy = 0;
      // positive a pulls the inner end down (angry), negative lifts it (worried)
      switch (ex.brows) {
        case "up": dy = -5 * k; break;
        case "worry": a = -14; dy = -2 * k; break;
        case "sad": a = -18; dy = -1 * k; break;
        case "angry": a = 20; dy = 2 * k; break;
        case "determined": a = 12; dy = 1 * k; break;
        case "raise1": dy = side === 1 ? -6 * k : 1 * k; a = side === 1 ? -8 : 6; break;
        default: a = 0;
      }
      const cx = x,
        cy = by + dy;
      const ca = Math.cos(rad(a)),
        sa = Math.sin(rad(a));
      // side: +1 = right brow. Positive a tilts the inner end down.
      const x1 = cx - bw * ca,
        y1 = cy - bw * sa * -side,
        x2 = cx + bw * ca,
        y2 = cy + bw * sa * -side;
      return `<path d="M${n(x1)} ${n(y1)} Q${n(cx)} ${n(cy - 2.5 * k)} ${n(x2)} ${n(y2)}" fill="none" stroke="${cfg.browColor || INK}" stroke-width="${n(3.6 * k)}" stroke-linecap="round"/>`;
    };
    if (ex.brows !== "none") s += brow(ex1, -1) + brow(ex2, 1);

    // nose
    const nx = look * 1.55,
      ny = hc + 14 * k;
    s += path(`M${n(nx + 1 * k)} ${n(ny - 8 * k)} Q${n(nx + 7 * k)} ${n(ny + 2 * k)} ${n(nx + 1.5 * k)} ${n(ny + 4 * k)} M${n(nx - 5 * k)} ${n(ny + 3 * k)} q${n(2.5 * k)} ${n(2 * k)} ${n(5 * k)} ${n(0.6 * k)}`, "none", { sw: 2.2, stroke: shade(skinShade, -0.35) });

    // mouth
    const mx = look * 1.3,
      my = hc + 26 * k;
    const mw = 9 * k;
    const lip = cfg.lip || "#b5484c";
    switch (ex.mouth) {
      case "smile":
        s += path(`M${n(mx - mw)} ${n(my - 2 * k)} Q${n(mx)} ${n(my + 7 * k)} ${n(mx + mw)} ${n(my - 2 * k)}`, "none", { sw: 2.6 });
        break;
      case "small":
        s += path(`M${n(mx - mw * 0.55)} ${n(my)} Q${n(mx)} ${n(my + 3 * k)} ${n(mx + mw * 0.55)} ${n(my)}`, "none", { sw: 2.4 });
        break;
      case "big":
        s += path(`M${n(mx - mw * 1.2)} ${n(my - 3 * k)} Q${n(mx)} ${n(my - 1 * k)} ${n(mx + mw * 1.2)} ${n(my - 3 * k)} Q${n(mx + mw)} ${n(my + 13 * k)} ${n(mx)} ${n(my + 13 * k)} Q${n(mx - mw)} ${n(my + 13 * k)} ${n(mx - mw * 1.2)} ${n(my - 3 * k)} Z`, "#5a1f24", { sw: 2.6 });
        s += fellipse(mx, my + 9 * k, mw * 0.6, 3.6 * k, "#e5737a");
        s += `<path d="M${n(mx - mw * 1.05)} ${n(my - 2 * k)} Q${n(mx)} ${n(my + 0.5 * k)} ${n(mx + mw * 1.05)} ${n(my - 2 * k)} L${n(mx + mw * 0.95)} ${n(my + 1.6 * k)} Q${n(mx)} ${n(my + 3.4 * k)} ${n(mx - mw * 0.95)} ${n(my + 1.6 * k)} Z" fill="#fff"/>`;
        break;
      case "grin":
        s += path(`M${n(mx - mw * 1.2)} ${n(my - 3 * k)} Q${n(mx)} ${n(my - 1 * k)} ${n(mx + mw * 1.2)} ${n(my - 3 * k)} Q${n(mx + mw * 0.9)} ${n(my + 9 * k)} ${n(mx)} ${n(my + 9 * k)} Q${n(mx - mw * 0.9)} ${n(my + 9 * k)} ${n(mx - mw * 1.2)} ${n(my - 3 * k)} Z`, "#fff", { sw: 2.6 });
        s += line(mx - mw * 1.0, my + 2.5 * k, mx + mw * 1.0, my + 2.5 * k, { sw: 1.6 });
        s += line(mx - mw * 0.35, my - 1.5 * k, mx - mw * 0.35, my + 8 * k, { sw: 1.4 }) + line(mx + mw * 0.35, my - 1.5 * k, mx + mw * 0.35, my + 8 * k, { sw: 1.4 });
        break;
      case "smirk":
        s += path(`M${n(mx - mw * 0.8)} ${n(my + 1 * k)} Q${n(mx + mw * 0.2)} ${n(my + 4 * k)} ${n(mx + mw * 1.1)} ${n(my - 4 * k)}`, "none", { sw: 2.6 });
        break;
      case "flat":
        s += line(mx - mw * 0.7, my + 1 * k, mx + mw * 0.7, my + 1 * k, { sw: 2.6 });
        break;
      case "firm":
        s += path(`M${n(mx - mw * 0.8)} ${n(my + 1 * k)} Q${n(mx)} ${n(my + 2.5 * k)} ${n(mx + mw * 0.8)} ${n(my)}`, "none", { sw: 3 });
        break;
      case "frown":
        s += path(`M${n(mx - mw * 0.9)} ${n(my + 4 * k)} Q${n(mx)} ${n(my - 4 * k)} ${n(mx + mw * 0.9)} ${n(my + 4 * k)}`, "none", { sw: 2.6 });
        break;
      case "o":
        s += ellipse(mx, my + 2 * k, 4.2 * k, 5.4 * k, "#5a1f24", { sw: 2.4 });
        break;
      case "open":
        s += path(`M${n(mx - mw * 0.8)} ${n(my - 1 * k)} Q${n(mx)} ${n(my + 1 * k)} ${n(mx + mw * 0.8)} ${n(my - 1 * k)} Q${n(mx + mw * 0.5)} ${n(my + 8 * k)} ${n(mx)} ${n(my + 8 * k)} Q${n(mx - mw * 0.5)} ${n(my + 8 * k)} ${n(mx - mw * 0.8)} ${n(my - 1 * k)} Z`, "#5a1f24", { sw: 2.4 });
        s += fellipse(mx, my + 5.6 * k, mw * 0.35, 1.8 * k, "#e5737a");
        break;
      case "yell":
        s += path(`M${n(mx - mw * 1.3)} ${n(my - 5 * k)} Q${n(mx)} ${n(my - 8 * k)} ${n(mx + mw * 1.3)} ${n(my - 5 * k)} Q${n(mx + mw * 1.1)} ${n(my + 15 * k)} ${n(mx)} ${n(my + 16 * k)} Q${n(mx - mw * 1.1)} ${n(my + 15 * k)} ${n(mx - mw * 1.3)} ${n(my - 5 * k)} Z`, "#5a1f24", { sw: 2.6 });
        s += `<path d="M${n(mx - mw * 1.1)} ${n(my - 4.5 * k)} Q${n(mx)} ${n(my - 7 * k)} ${n(mx + mw * 1.1)} ${n(my - 4.5 * k)} L${n(mx + mw)} ${n(my - 1 * k)} L${n(mx - mw)} ${n(my - 1 * k)} Z" fill="#fff"/>`;
        s += fellipse(mx, my + 11 * k, mw * 0.65, 3.6 * k, "#e5737a");
        break;
      case "wavy":
        s += path(`M${n(mx - mw)} ${n(my + 2 * k)} q${n(mw * 0.33)} ${n(-4 * k)} ${n(mw * 0.66)} 0 t${n(mw * 0.66)} 0 t${n(mw * 0.66)} 0`, "none", { sw: 2.4 });
        break;
      case "gritted":
        s += path(`M${n(mx - mw * 1.1)} ${n(my - 3 * k)} L${n(mx + mw * 1.1)} ${n(my - 3 * k)} L${n(mx + mw * 1.0)} ${n(my + 5 * k)} L${n(mx - mw * 1.0)} ${n(my + 5 * k)} Z`, "#fff", { sw: 2.4 });
        s += line(mx - mw * 1.05, my + 1 * k, mx + mw * 1.05, my + 1 * k, { sw: 1.4 });
        [-0.5, 0, 0.5].forEach((f) => (s += line(mx + mw * f, my - 3 * k, mx + mw * f, my + 5 * k, { sw: 1.3 })));
        break;
      case "tongue":
        s += path(`M${n(mx - mw)} ${n(my)} q${n(mw * 0.5)} ${n(-4 * k)} ${n(mw)} 0 t${n(mw)} 0`, "none", { sw: 2.4 });
        s += path(`M${n(mx - 3 * k)} ${n(my + 1 * k)} Q${n(mx)} ${n(my + 12 * k)} ${n(mx + 5 * k)} ${n(my + 1 * k)}`, "#e5737a", { sw: 2.2 });
        break;
      case "tongueSide":
        s += path(`M${n(mx - mw * 0.7)} ${n(my)} Q${n(mx)} ${n(my + 3 * k)} ${n(mx + mw * 0.7)} ${n(my)}`, "none", { sw: 2.4 });
        s += path(`M${n(mx + mw * 0.3)} ${n(my + 1.5 * k)} q${n(4 * k)} ${n(6 * k)} ${n(7 * k)} ${n(-0.5 * k)}`, "#e5737a", { sw: 2 });
        break;
      case "puffed":
        s += fellipse(mx - mw * 1.4, my - 1 * k, 6 * k, 6 * k, shade(skin, 0.12));
        s += fellipse(mx + mw * 1.4, my - 1 * k, 6 * k, 6 * k, shade(skin, 0.12));
        s += path(`M${n(mx - mw * 0.6)} ${n(my)} Q${n(mx)} ${n(my - 3 * k)} ${n(mx + mw * 0.6)} ${n(my)}`, "none", { sw: 2.6 });
        break;
      case "pout":
        s += path(`M${n(mx - mw * 0.2)} ${n(my + 1 * k)} q${n(mw * 0.4)} ${n(-3 * k)} ${n(mw * 0.8)} 0`, "none", { sw: 2.6 });
        break;
      case "drool":
        s += ellipse(mx, my + 1 * k, 4 * k, 3 * k, "#5a1f24", { sw: 2 });
        s += path(`M${n(mx + 3 * k)} ${n(my + 3 * k)} q${n(2 * k)} ${n(8 * k)} ${n(0)} ${n(10 * k)} q${n(-3 * k)} ${n(-2 * k)} ${n(0)} ${n(-10 * k)}`, "#bfe6ff", { sw: 1.6, stroke: "#5ea9d6" });
        break;
      default:
        break;
    }

    if (extras.includes("tears")) {
      s += path(`M${n(ex1 - 2 * k)} ${n(ey + 9 * k)} q${n(-3 * k)} ${n(12 * k)} ${n(-1 * k)} ${n(20 * k)}`, "none", { sw: 3.6, stroke: "#5fb3ea" });
      s += path(`M${n(ex2 + 2 * k)} ${n(ey + 9 * k)} q${n(3 * k)} ${n(12 * k)} ${n(1 * k)} ${n(20 * k)}`, "none", { sw: 3.6, stroke: "#5fb3ea" });
    }
    if (extras.includes("gloom")) {
      [-12, -4, 4, 12].forEach((dx) => (s += line(look + dx * k, hc - 30 * k, look + dx * k, hc - 12 * k, { sw: 2, stroke: "#4a4a7a", op: 0.7 })));
    }
    if (extras.includes("shine")) {
      s += fcircle(ex1 + 1 * k, ey - 1 * k, 1.8 * k, "#fff") + fcircle(ex2 + 1 * k, ey - 1 * k, 1.8 * k, "#fff");
    }
    if (cfg.freckles) {
      [[-1, 0], [1, 0.5], [0, 1]].forEach(([a, b]) => {
        s += fcircle(ex1 - 3 * k + a * 3 * k, ey + 12 * k + b * 2 * k, 1 * k, shade(skin, -0.35));
        s += fcircle(ex2 + 3 * k + a * 3 * k, ey + 12 * k + b * 2 * k, 1 * k, shade(skin, -0.35));
      });
    }
    return s;
  }

  // ---------- hair ----------
  function bumpy(cx, cy, rx, ry, a0, a1, N, amp, rnd, varAmp) {
    let d = "";
    for (let i = 1; i <= N; i++) {
      const t = rad(a0 + ((a1 - a0) * i) / N);
      const tm = rad(a0 + ((a1 - a0) * (i - 0.5)) / N);
      const k = 1 + amp * (1 + (rnd ? (rnd() - 0.5) * (varAmp || 0) : 0));
      d += ` Q${n(cx + rx * k * Math.cos(tm))} ${n(cy + ry * k * Math.sin(tm))} ${n(cx + rx * Math.cos(t))} ${n(cy + ry * Math.sin(t))}`;
    }
    return d;
  }

  function headPath(r, hc, jaw = 1) {
    return `M0 ${n(hc - 1.1 * r)} C${n(0.62 * r)} ${n(hc - 1.1 * r)} ${n(r)} ${n(hc - 0.62 * r)} ${n(r)} ${n(hc - 0.05 * r)} C${n(r)} ${n(hc + 0.55 * r)} ${n(0.62 * r * jaw)} ${n(hc + 1.06 * r)} 0 ${n(hc + 1.06 * r)} C${n(-0.62 * r * jaw)} ${n(hc + 1.06 * r)} ${n(-r)} ${n(hc + 0.55 * r)} ${n(-r)} ${n(hc - 0.05 * r)} C${n(-r)} ${n(hc - 0.62 * r)} ${n(-0.62 * r)} ${n(hc - 1.1 * r)} 0 ${n(hc - 1.1 * r)} Z`;
  }

  function texture(r, hc, color, rnd, count, yTop, yBot, xw) {
    let s = "";
    for (let i = 0; i < count; i++) {
      const x = (rnd() - 0.5) * 2 * xw * r;
      const y = hc + (yTop + rnd() * (yBot - yTop)) * r;
      s += `<path d="M${n(x)} ${n(y)} q${n(3 + rnd() * 2)} ${n(-4)} ${n(6 + rnd() * 2)} 0" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round"/>`;
    }
    return s;
  }

  const HAIR = {
    lex(B, col, o) {
      const r = B.r,
        hc = B.hcy,
        k = r / 40,
        look = 5 * k;
      const rnd = C.rng(11);
      const messy = o.messy;
      let d = `M${n(0.95 * r)} ${n(hc + 0.02 * r)} L${n(1.03 * r)} ${n(hc - 0.2 * r)}`;
      d += bumpy(0, hc - 0.2 * r, 1.03 * r, 1.08 * r, -8, -172, messy ? 11 : 13, messy ? 0.2 : 0.11, rnd, messy ? 1.6 : 0.4);
      d += ` L${n(-0.95 * r)} ${n(hc + 0.02 * r)} L${n(-0.86 * r)} ${n(hc - 0.36 * r)} Q${n(-0.45 * r + look)} ${n(hc - 0.66 * r)} ${n(look)} ${n(hc - 0.62 * r)} Q${n(0.5 * r + look)} ${n(hc - 0.66 * r)} ${n(0.86 * r)} ${n(hc - 0.36 * r)} Z`;
      let front = path(d, col, { sw: 2.8 });
      front += `<g opacity=".55">${texture(r, hc, shade(col, 0.3), C.rng(5), messy ? 8 : 10, -1.1, -0.74, 0.58)}</g>`;
      if (messy) {
        const tufts = [
          [-0.55, -1.25, -25],
          [0.1, -1.38, 5],
          [0.62, -1.2, 35],
          [-0.95, -0.75, -70],
        ];
        tufts.forEach(([tx, ty, a]) => {
          const x = tx * r,
            y = hc + ty * r;
          front += `<path d="M${n(x - 6 * k)} ${n(y + 8 * k)} Q${n(x)} ${n(y - 10 * k)} ${n(x + 9 * k)} ${n(y - 14 * k)} Q${n(x + 4 * k)} ${n(y - 2 * k)} ${n(x + 6 * k)} ${n(y + 8 * k)} Z" fill="${col}" stroke="${INK}" stroke-width="2.4" stroke-linejoin="round" transform="rotate(${a} ${n(x)} ${n(y)})"/>`;
        });
      }
      return { back: "", front };
    },
    crop(B, col, o) {
      const r = B.r,
        hc = B.hcy,
        k = r / 40,
        look = 5 * k;
      let d = `M${n(0.96 * r)} ${n(hc - 0.02 * r)} L${n(1.01 * r)} ${n(hc - 0.25 * r)}`;
      d += bumpy(0, hc - 0.22 * r, 1.01 * r, 0.98 * r, -10, -170, 16, 0.06, null);
      d += ` L${n(-0.96 * r)} ${n(hc - 0.02 * r)} L${n(-0.88 * r)} ${n(hc - 0.42 * r)} Q${n(-0.4 * r + look)} ${n(hc - 0.74 * r)} ${n(look)} ${n(hc - 0.7 * r)} Q${n(0.45 * r + look)} ${n(hc - 0.74 * r)} ${n(0.88 * r)} ${n(hc - 0.42 * r)} Z`;
      return { back: "", front: path(d, col, { sw: 2.6 }) + texture(r, hc, shade(col, 0.22), C.rng(9), 8, -1.12, -0.8, 0.55) };
    },
    puff(B, col, o) {
      const r = B.r,
        hc = B.hcy,
        k = r / 40,
        look = 5 * k;
      const rnd = C.rng(21);
      let back = path(`M${n(-0.62 * r)} ${n(hc - 1.28 * r)}` + bumpy(-0.05 * r, hc - 1.32 * r, 0.62 * r, 0.52 * r, 160, -200, 14, 0.12, rnd, 0.6) + " Z", col, { sw: 2.8 });
      back += texture(r, hc, shade(col, 0.28), C.rng(3), 8, -1.7, -1.1, 0.45);
      let d = `M${n(0.97 * r)} ${n(hc + 0.05 * r)} L${n(1.03 * r)} ${n(hc - 0.25 * r)} Q${n(1.02 * r)} ${n(hc - 1.18 * r)} 0 ${n(hc - 1.2 * r)} Q${n(-1.02 * r)} ${n(hc - 1.18 * r)} ${n(-1.03 * r)} ${n(hc - 0.25 * r)} L${n(-0.97 * r)} ${n(hc + 0.05 * r)} L${n(-0.85 * r)} ${n(hc - 0.4 * r)} Q${n(-0.4 * r)} ${n(hc - 0.72 * r)} ${n(look - 0.15 * r)} ${n(hc - 0.66 * r)} Q${n(0.5 * r)} ${n(hc - 0.74 * r)} ${n(0.85 * r)} ${n(hc - 0.4 * r)} Z`;
      let front = path(d, col, { sw: 2.6 });
      // headband
      const band = o.band || "#e0533d";
      front += path(`M${n(-0.98 * r)} ${n(hc - 0.52 * r)} Q0 ${n(hc - 1.2 * r)} ${n(0.98 * r)} ${n(hc - 0.52 * r)} L${n(0.92 * r)} ${n(hc - 0.72 * r)} Q0 ${n(hc - 1.38 * r)} ${n(-0.92 * r)} ${n(hc - 0.72 * r)} Z`, band, { sw: 2.4 });
      front += fcircle(-0.4 * r, hc - 1.0 * r, 2.4 * k, shade(band, 0.45)) + fcircle(0.1 * r, hc - 1.08 * r, 2.4 * k, shade(band, 0.45)) + fcircle(0.55 * r, hc - 0.93 * r, 2.4 * k, shade(band, 0.45));
      front += `<path d="M${n(0.86 * r)} ${n(hc - 0.36 * r)} q${n(5 * k)} ${n(4 * k)} ${n(1 * k)} ${n(8 * k)} q${n(-3 * k)} ${n(-3 * k)} ${n(1 * k)} ${n(-4 * k)}" fill="none" stroke="${col}" stroke-width="1.8"/>`;
      return { back, front };
    },
    pastor(B, col, o) {
      const r = B.r,
        hc = B.hcy,
        k = r / 40;
      const side = (sx) =>
        path(`M${n(sx * 0.98 * r)} ${n(hc + 0.05 * r)} Q${n(sx * 1.12 * r)} ${n(hc - 0.3 * r)} ${n(sx * 0.9 * r)} ${n(hc - 0.62 * r)} Q${n(sx * 0.82 * r)} ${n(hc - 0.4 * r)} ${n(sx * 0.86 * r)} ${n(hc - 0.05 * r)} Z`, col, { sw: 2.4 });
      let front = side(1) + side(-1);
      front += path(`M${n(-0.35 * r)} ${n(hc - 0.95 * r)} Q${n(-0.1 * r)} ${n(hc - 1.08 * r)} ${n(0.15 * r)} ${n(hc - 1.0 * r)}`, "none", { sw: 3, stroke: "#fff", op: 0.6 });
      return { back: "", front };
    },
    hat(B, col, o) {
      const r = B.r,
        hc = B.hcy,
        k = r / 40;
      const hatC = o.hatColor || "#7b3f9e";
      let back = path(`M${n(-1.0 * r)} ${n(hc + 0.2 * r)}` + bumpy(0, hc - 0.1 * r, 1.08 * r, 1.05 * r, 170, 10, 12, 0.1, C.rng(4), 0.4) + " Z", col, { sw: 2.4 });
      let front = path(`M${n(0.93 * r)} ${n(hc - 0.1 * r)}` + bumpy(0, hc - 0.35 * r, 0.98 * r, 0.6 * r, 10, -190, 9, 0.14, C.rng(8), 0.3) + " Z", col, { sw: 2.2 });
      front += `<g transform="rotate(-8 0 ${n(hc - 0.75 * r)})">`;
      front += ellipse(0, hc - 0.72 * r, 1.75 * r, 0.34 * r, hatC, { sw: 2.8 });
      front += path(`M${n(-0.82 * r)} ${n(hc - 0.75 * r)} Q${n(-0.85 * r)} ${n(hc - 1.62 * r)} 0 ${n(hc - 1.64 * r)} Q${n(0.85 * r)} ${n(hc - 1.62 * r)} ${n(0.82 * r)} ${n(hc - 0.75 * r)} Q0 ${n(hc - 0.6 * r)} ${n(-0.82 * r)} ${n(hc - 0.75 * r)} Z`, hatC, { sw: 2.8 });
      front += path(`M${n(-0.84 * r)} ${n(hc - 0.95 * r)} Q0 ${n(hc - 0.8 * r)} ${n(0.84 * r)} ${n(hc - 0.95 * r)} L${n(0.83 * r)} ${n(hc - 1.12 * r)} Q0 ${n(hc - 0.98 * r)} ${n(-0.83 * r)} ${n(hc - 1.12 * r)} Z`, shade(hatC, -0.35), { sw: 2 });
      [0, 72, 144, 216, 288].forEach((a) => (front += circle(0.55 * r + Math.cos(rad(a)) * 7 * k, hc - 1.05 * r + Math.sin(rad(a)) * 7 * k, 6 * k, "#f6c2d6", { sw: 1.8 })));
      front += circle(0.55 * r, hc - 1.05 * r, 4 * k, "#f4c542", { sw: 1.8 });
      front += `</g>`;
      return { back, front };
    },
    grayCurls(B, col, o) {
      const r = B.r,
        hc = B.hcy;
      let d = `M${n(0.97 * r)} ${n(hc)}` + bumpy(0, hc - 0.25 * r, 1.06 * r, 1.0 * r, 0, -180, 12, 0.14, C.rng(14), 0.5);
      d += ` L${n(-0.88 * r)} ${n(hc - 0.4 * r)} Q0 ${n(hc - 0.9 * r)} ${n(0.88 * r)} ${n(hc - 0.4 * r)} Z`;
      return { back: "", front: path(d, col, { sw: 2.4 }) + texture(r, hc, shade(col, -0.18), C.rng(2), 10, -1.2, -0.6, 0.7) };
    },
    bob(B, col, o) {
      const r = B.r,
        hc = B.hcy,
        k = r / 40,
        look = 5 * k;
      const back = path(`M${n(-1.12 * r)} ${n(hc + 0.75 * r)} Q${n(-1.25 * r)} ${n(hc - 1.3 * r)} 0 ${n(hc - 1.22 * r)} Q${n(1.25 * r)} ${n(hc - 1.3 * r)} ${n(1.12 * r)} ${n(hc + 0.75 * r)} Z`, col, { sw: 2.6 });
      const front = path(`M${n(1.02 * r)} ${n(hc + 0.2 * r)} Q${n(1.08 * r)} ${n(hc - 1.18 * r)} 0 ${n(hc - 1.18 * r)} Q${n(-1.08 * r)} ${n(hc - 1.18 * r)} ${n(-1.02 * r)} ${n(hc + 0.2 * r)} L${n(-0.85 * r)} ${n(hc - 0.35 * r)} L${n(-0.5 * r)} ${n(hc - 0.5 * r)} L${n(-0.2 * r + look)} ${n(hc - 0.38 * r)} L${n(0.1 * r + look)} ${n(hc - 0.5 * r)} L${n(0.5 * r + look)} ${n(hc - 0.42 * r)} L${n(0.85 * r)} ${n(hc - 0.4 * r)} Z`, col, { sw: 2.6 });
      return { back, front };
    },
    cap(B, col, o) {
      const r = B.r,
        hc = B.hcy,
        k = r / 40;
      const capC = o.capColor || "#d8402f";
      let front = path(`M${n(0.97 * r)} ${n(hc - 0.05 * r)} L${n(1.0 * r)} ${n(hc - 0.35 * r)} L${n(-1.0 * r)} ${n(hc - 0.35 * r)} L${n(-0.97 * r)} ${n(hc - 0.05 * r)} Z`, col, { sw: 2.2 });
      front += path(`M${n(-1.04 * r)} ${n(hc - 0.4 * r)} Q${n(-1.05 * r)} ${n(hc - 1.35 * r)} 0 ${n(hc - 1.36 * r)} Q${n(1.05 * r)} ${n(hc - 1.35 * r)} ${n(1.04 * r)} ${n(hc - 0.4 * r)} Z`, capC, { sw: 2.8 });
      front += path(`M${n(0.3 * r)} ${n(hc - 0.45 * r)} Q${n(1.0 * r)} ${n(hc - 0.62 * r)} ${n(1.6 * r)} ${n(hc - 0.38 * r)} Q${n(1.05 * r)} ${n(hc - 0.25 * r)} ${n(0.3 * r)} ${n(hc - 0.4 * r)} Z`, shade(capC, -0.2), { sw: 2.6 });
      front += fcircle(0, hc - 1.36 * r, 3 * k, shade(capC, -0.3));
      return { back: "", front };
    },
    puffs(B, col, o) {
      const r = B.r,
        hc = B.hcy,
        k = r / 40,
        look = 5 * k;
      let back = "";
      [-1, 1].forEach((sx) => {
        back += path(`M${n(sx * 0.7 * r - 0.42 * r)} ${n(hc - 1.05 * r)}` + bumpy(sx * 0.7 * r, hc - 1.05 * r, 0.42 * r, 0.42 * r, 180, -180, 12, 0.14, C.rng(6 + sx), 0.4) + " Z", col, { sw: 2.6 });
      });
      const front = path(`M${n(0.97 * r)} ${n(hc + 0.03 * r)} Q${n(1.04 * r)} ${n(hc - 1.15 * r)} 0 ${n(hc - 1.16 * r)} Q${n(-1.04 * r)} ${n(hc - 1.15 * r)} ${n(-0.97 * r)} ${n(hc + 0.03 * r)} L${n(-0.85 * r)} ${n(hc - 0.42 * r)} Q${n(look)} ${n(hc - 0.85 * r)} ${n(0.85 * r)} ${n(hc - 0.42 * r)} Z`, col, { sw: 2.6 });
      return { back, front };
    },
    pony(B, col, o) {
      const r = B.r,
        hc = B.hcy,
        k = r / 40,
        look = 5 * k;
      const back = path(`M${n(-0.8 * r)} ${n(hc - 0.9 * r)} Q${n(-1.7 * r)} ${n(hc - 0.6 * r)} ${n(-1.45 * r)} ${n(hc + 0.6 * r)} Q${n(-1.2 * r)} ${n(hc - 0.2 * r)} ${n(-0.75 * r)} ${n(hc - 0.55 * r)} Z`, col, { sw: 2.6 });
      const front = path(`M${n(0.98 * r)} ${n(hc + 0.1 * r)} Q${n(1.06 * r)} ${n(hc - 1.18 * r)} 0 ${n(hc - 1.18 * r)} Q${n(-1.06 * r)} ${n(hc - 1.18 * r)} ${n(-0.98 * r)} ${n(hc + 0.1 * r)} L${n(-0.86 * r)} ${n(hc - 0.4 * r)} Q${n(look - 0.2 * r)} ${n(hc - 0.75 * r)} ${n(look + 0.1 * r)} ${n(hc - 0.55 * r)} Q${n(0.5 * r)} ${n(hc - 0.8 * r)} ${n(0.86 * r)} ${n(hc - 0.4 * r)} Z`, col, { sw: 2.6 });
      return { back, front: front + fcircle(-0.95 * r, hc - 0.75 * r, 5 * k, o.tie || "#f0b429") };
    },
    shag(B, col, o) {
      const r = B.r,
        hc = B.hcy,
        k = r / 40,
        look = 5 * k;
      let d = `M${n(1.0 * r)} ${n(hc + 0.15 * r)} Q${n(1.12 * r)} ${n(hc - 1.25 * r)} 0 ${n(hc - 1.22 * r)} Q${n(-1.12 * r)} ${n(hc - 1.25 * r)} ${n(-1.0 * r)} ${n(hc + 0.15 * r)}`;
      const pts = [-0.92, -0.65, -0.4, -0.15, 0.1, 0.35, 0.6, 0.88];
      d += ` L${n(-0.92 * r)} ${n(hc - 0.25 * r)}`;
      pts.forEach((p, i) => {
        d += ` L${n(p * r + look * 0.5)} ${n(hc - (i % 2 ? 0.55 : 0.32) * r)}`;
      });
      d += " Z";
      return { back: "", front: path(d, col, { sw: 2.6 }) };
    },
    braids(B, col, o) {
      const r = B.r,
        hc = B.hcy,
        k = r / 40,
        look = 5 * k;
      let back = "";
      [-1, 1].forEach((sx) => {
        for (let i = 0; i < 3; i++) back += C.stroke2([[sx * (0.75 + i * 0.12) * r, hc - 0.3 * r], [sx * (0.85 + i * 0.12) * r, hc + 0.9 * r]], 6 * k, col, 2);
      });
      let front = path(`M${n(0.97 * r)} ${n(hc + 0.02 * r)} Q${n(1.04 * r)} ${n(hc - 1.15 * r)} 0 ${n(hc - 1.16 * r)} Q${n(-1.04 * r)} ${n(hc - 1.15 * r)} ${n(-0.97 * r)} ${n(hc + 0.02 * r)} L${n(-0.85 * r)} ${n(hc - 0.45 * r)} Q${n(look)} ${n(hc - 0.8 * r)} ${n(0.85 * r)} ${n(hc - 0.45 * r)} Z`, col, { sw: 2.6 });
      [-0.5, -0.2, 0.1, 0.4].forEach((x) => (front += path(`M${n(x * r + look)} ${n(hc - 0.72 * r)} Q${n(x * r * 1.2)} ${n(hc - 1.0 * r)} ${n(x * r * 0.9)} ${n(hc - 1.14 * r)}`, "none", { sw: 1.6, stroke: shade(col, 0.35) })));
      return { back, front };
    },
    bald(B, col, o) {
      return { back: "", front: "" };
    },
  };

  function beard(B, col, cfg) {
    const r = B.r,
      hc = B.hcy,
      k = r / 40,
      look = 5 * k;
    let s = path(`M${n(-0.97 * r)} ${n(hc - 0.05 * r)} C${n(-0.97 * r)} ${n(hc + 0.6 * r)} ${n(-0.6 * r)} ${n(hc + 1.16 * r)} ${n(look * 0.6)} ${n(hc + 1.16 * r)} C${n(0.62 * r)} ${n(hc + 1.16 * r)} ${n(0.97 * r)} ${n(hc + 0.6 * r)} ${n(0.97 * r)} ${n(hc - 0.05 * r)} L${n(0.8 * r)} ${n(hc + 0.1 * r)} Q${n(0.6 * r + look)} ${n(hc + 0.92 * r)} ${n(look)} ${n(hc + 0.9 * r)} Q${n(-0.6 * r + look)} ${n(hc + 0.92 * r)} ${n(-0.8 * r)} ${n(hc + 0.1 * r)} Z`, col, { sw: 2.4 });
    return s;
  }
  function mustache(B, col) {
    const r = B.r,
      hc = B.hcy,
      k = r / 40,
      look = 5 * k;
    const mx = look * 1.3,
      my = hc + 20 * k;
    return path(`M${n(mx)} ${n(my - 1 * k)} Q${n(mx - 8 * k)} ${n(my - 6 * k)} ${n(mx - 15 * k)} ${n(my + 2 * k)} Q${n(mx - 7 * k)} ${n(my + 1 * k)} ${n(mx)} ${n(my + 2 * k)} Q${n(mx + 7 * k)} ${n(my + 1 * k)} ${n(mx + 15 * k)} ${n(my + 2 * k)} Q${n(mx + 8 * k)} ${n(my - 6 * k)} ${n(mx)} ${n(my - 1 * k)} Z`, col, { sw: 2 });
  }
  function glasses(B, color) {
    const r = B.r,
      hc = B.hcy,
      k = r / 40,
      look = 5 * k;
    const ey = hc + 2 * k;
    const g = color || INK;
    return `<g fill="#fff" fill-opacity=".18" stroke="${g}" stroke-width="2.6"><rect x="${n(look - 25 * k)}" y="${n(ey - 9 * k)}" width="${n(19 * k)}" height="${n(16 * k)}" rx="${n(5 * k)}"/><rect x="${n(look + 6 * k)}" y="${n(ey - 9 * k)}" width="${n(19 * k)}" height="${n(16 * k)}" rx="${n(5 * k)}"/></g>${line(look - 6 * k, ey - 3 * k, look + 6 * k, ey - 3 * k, { sw: 2.4, stroke: g })}`;
  }

  // ---------- garments ----------
  function torsoPath(B, flare, drop, top) {
    const sw = B.sw,
      tb = B.tb + flare,
      t = B.sy - 6 + (top || 0),
      bot = B.hy + 8 + drop;
    return `M${n(-sw + 8)} ${n(t)} Q0 ${n(t - 6)} ${n(sw - 8)} ${n(t)} Q${n(sw + 7)} ${n(t + 1)} ${n(sw + 7)} ${n(t + 16)} L${n(tb + 2)} ${n(bot - 4)} Q${n(tb + 2)} ${n(bot + 2)} ${n(tb - 6)} ${n(bot + 2)} Q0 ${n(bot + 6)} ${n(-tb + 6)} ${n(bot + 2)} Q${n(-tb - 2)} ${n(bot + 2)} ${n(-tb - 2)} ${n(bot - 4)} L${n(-sw - 7)} ${n(t + 16)} Q${n(-sw - 7)} ${n(t + 1)} ${n(-sw + 8)} ${n(t)} Z`;
  }

  function gear(cx, cy, r, color) {
    let d = "";
    const N = 8;
    for (let i = 0; i < N * 2; i++) {
      const a = (i / (N * 2)) * Math.PI * 2;
      const rr = i % 2 === 0 ? r : r * 0.78;
      const a2 = a + Math.PI / (N * 2);
      d += (i === 0 ? "M" : " L") + n(cx + Math.cos(a) * rr) + " " + n(cy + Math.sin(a) * rr) + " L" + n(cx + Math.cos(a2) * rr) + " " + n(cy + Math.sin(a2) * rr);
    }
    return path(d + " Z", color, { sw: 2 }) + circle(cx, cy, r * 0.35, "#fff", { sw: 1.8 });
  }
  C.gear = gear;

  function stains(B, rnd, k) {
    const cols = ["#8a6a2f", "#c9a227", "#b8442f", "#6f7f3a"];
    let s = "";
    const spots = [
      [-0.35, 0.3, 9],
      [0.4, 0.55, 7],
      [-0.1, 0.75, 6],
      [0.2, 0.15, 5],
    ];
    spots.forEach(([fx, fy, sz], i) => {
      const x = fx * B.tb * 1.6,
        y = B.sy + (B.hy - B.sy) * fy;
      let d = "M";
      for (let j = 0; j < 9; j++) {
        const a = (j / 9) * Math.PI * 2;
        const rr = sz * (0.7 + rnd() * 0.6);
        d += (j ? " L" : "") + n(x + Math.cos(a) * rr) + " " + n(y + Math.sin(a) * rr * 0.8);
      }
      s += `<path d="${d} Z" fill="${cols[i % cols.length]}" opacity=".75"/>`;
    });
    return s;
  }

  function wrinkles(B, col) {
    const c = shade(col, -0.3);
    let s = "";
    [
      [-0.5, 0.35, 1],
      [0.45, 0.25, -1],
      [-0.2, 0.62, 1],
      [0.35, 0.78, -1],
    ].forEach(([fx, fy, d]) => {
      const x = fx * B.tb,
        y = B.sy + (B.hy - B.sy) * fy;
      s += `<path d="M${n(x)} ${n(y)} q${n(6 * d)} ${n(4)} ${n(12 * d)} ${n(-2)}" fill="none" stroke="${c}" stroke-width="2" stroke-linecap="round"/>`;
    });
    return s;
  }

  // ---------- person ----------
  function person(cfg, o) {
    o = o || {};
    const B = BODY[cfg.type || "teen"];
    const x = o.x || 0,
      y = o.y || 0,
      s = o.s || 1,
      f = o.f || 1;
    const k = B.r / 40;
    const ex = Object.assign({}, EXPR[o.expr || "neutral"] || EXPR.neutral);
    const top = Object.assign({}, cfg.top || {});
    const bottom = cfg.bottom || { type: "pants", color: "#3d4f7a" };
    const skin = cfg.skin,
      skinShade = cfg.shade || shade(cfg.skin, -0.15);
    const messy = !!o.messy;
    const rnd = C.rng(3);

    const poseFn = C.POSES[o.pose || "stand"] || C.POSES.stand;
    const pose = Object.assign({}, poseFn(B), o.limbs || {});
    if (o.la) pose.la = o.la;
    if (o.ra) pose.ra = o.ra;
    if (o.ll) pose.ll = o.ll;
    if (o.rl) pose.rl = o.rl;
    const handL = o.handL || pose.handL || "open",
      handR = o.handR || pose.handR || "open";

    const floorSit = o.floorSit || pose.floorSit;
    const seated = (o.seated || pose.seated) && !floorSit;
    const kneel = o.kneel || pose.kneel;
    const bodyDy = floorSit ? -14 - B.hy : seated ? -(B.sh + 14) - B.hy : kneel ? B.th * 0.92 : 0;

    let legs = "";
    const pantsC = bottom.color;
    const shoeC = (cfg.shoes && cfg.shoes.color) || "#f2f2f2";
    const soleC = cfg.shoes && cfg.shoes.sole !== undefined ? cfg.shoes.sole : "#ffffff";
    const barefoot = cfg.shoes && cfg.shoes.none;
    const legW = B.lw + (bottom.type === "pants" && bottom.baggy ? 4 : 0);
    if (!o.noLegs) {
      [-1, 1].forEach((side) => {
        const hip = [side * B.hw, B.hy + bodyDy];
        let L;
        if (floorSit) {
          L = [hip, [side * (B.hw + 5), -14 - B.th * 0.85], [side * (B.hw + 10) + 4, -4]];
        } else if (seated) {
          const kx = side * (B.hw + 3),
            ky = hip[1] + 10;
          const foot = [side * (B.hw + 5) + 2, -4];
          L = [hip, [kx, ky], foot];
        } else if (kneel) {
          L = [hip, [side * (B.hw + 2), -6], [side * (B.hw + 2) - 18, -6]];
        } else {
          const spec = side < 0 ? pose.ll : pose.rl;
          L = solve(hip, B.th, B.sh, spec || [3, 0], side, "leg");
        }
        const shinColor = bottom.type === "shorts" || bottom.type === "skirt" || bottom.type === "dress" ? (cfg.socks || skin) : pantsC;
        const thighColor = bottom.type === "skirt" || bottom.type === "dress" ? (cfg.socks || skin) : pantsC;
        if (seated) {
          legs += stroke2([L[1], L[2]], B.lw * 0.95, shinColor);
          legs += fellipse(L[1][0], L[1][1] - 4, B.lw * 0.75, B.lw * 0.7, thighColor) + `<ellipse cx="${n(L[1][0])}" cy="${n(L[1][1] - 4)}" rx="${n(B.lw * 0.75 + 1)}" ry="${n(B.lw * 0.7 + 1)}" fill="${thighColor}" stroke="${INK}" stroke-width="2.6"/>`;
        } else if (kneel) {
          legs += stroke2([L[0], L[1]], legW, thighColor);
        } else {
          if (bottom.type === "shorts") {
            legs += stroke2([L[1], L[2]], B.lw * 0.85, skin);
            legs += stroke2([L[0], [L[0][0] + (L[1][0] - L[0][0]) * 0.75, L[0][1] + (L[1][1] - L[0][1]) * 0.75]], legW + 4, pantsC);
          } else {
            legs += stroke2([L[0], L[1], L[2]], legW, shinColor === pantsC ? pantsC : shinColor);
            if (shinColor !== pantsC && thighColor === pantsC) legs += stroke2([L[0], L[1]], legW, pantsC);
          }
        }
        if (!kneel) {
          if (barefoot) legs += ellipse(L[2][0] + 6, L[2][1] + 2, B.foot * 0.9, B.foot * 0.45, skin, { sw: 2.4 });
          else legs += shoe(L[2], B.foot, shoeC, soleC, messy && cfg.messyLaces !== false, 1);
        }
      });
    }

    // upper body
    let up = "";
    const arms = { back: "", mid: "", front: "" };
    const sleeve = top.sleeve || "long";
    const topC = top.color || "#2a9d8f";
    const armColor = sleeve === "long" ? (top.armColor || topC) : skin;
    const hands = {};
    [-1, 1].forEach((side) => {
      const spec = side < 0 ? pose.la : pose.ra;
      const S = [side * (B.sw - 2), B.sy + 6];
      const A = solve(S, B.ua, B.fa, spec || [8, -6], side, "arm");
      hands[side] = A;
      let a = "";
      if (sleeve === "long") {
        a += stroke2(A, B.aw + 3, armColor);
        // cuff
        const dx = A[2][0] - A[1][0],
          dy = A[2][1] - A[1][1],
          L = Math.hypot(dx, dy) || 1;
        const cx = A[2][0] - (dx / L) * 4,
          cy = A[2][1] - (dy / L) * 4;
        const px = (-dy / L) * (B.aw / 2 + 3),
          py = (dx / L) * (B.aw / 2 + 3);
        a += line(cx - px, cy - py, cx + px, cy + py, { sw: 2 });
      } else {
        a += stroke2(A, B.aw, skin);
        const M = [A[0][0] + (A[1][0] - A[0][0]) * (sleeve === "short" ? 0.62 : 0.2), A[0][1] + (A[1][1] - A[0][1]) * (sleeve === "short" ? 0.62 : 0.2)];
        if (sleeve !== "none") a += stroke2([A[0], M], B.aw + 8, topC);
      }
      const hk = side < 0 ? handL : handR;
      if (hk !== "pray") a += handShape(A[2], A[1], B.hand, skin, hk);
      const layer = spec && spec.layer ? spec.layer : "mid";
      arms[layer] += a;
    });
    if (handL === "pray" || handR === "pray") {
      const hx = (hands[-1][2][0] + hands[1][2][0]) / 2,
        hy2 = (hands[-1][2][1] + hands[1][2][1]) / 2;
      const r = B.hand;
      arms.mid += path(`M${n(hx)} ${n(hy2 - r * 2.1)} Q${n(hx + r * 1.15)} ${n(hy2 - r * 0.7)} ${n(hx + r * 0.95)} ${n(hy2 + r * 0.8)} Q${n(hx)} ${n(hy2 + r * 1.3)} ${n(hx - r * 0.95)} ${n(hy2 + r * 0.8)} Q${n(hx - r * 1.15)} ${n(hy2 - r * 0.7)} ${n(hx)} ${n(hy2 - r * 2.1)} Z`, skin, { sw: 2.6 });
      arms.mid += line(hx, hy2 - r * 1.7, hx, hy2 + r * 0.9, { sw: 1.8 });
    }

    // neck & torso
    const neck = C.rect(-7 * k, B.sy - 20 * k, 14 * k, 26 * k, skinShade, { sw: 2.4 });
    let torso = "";
    let afterTorso = "";
    const tt = top.type || "tee";
    const flare = tt === "hoodie" ? 5 : tt === "dress" ? 2 : 0;
    const drop = tt === "hoodie" ? 12 : tt === "dress" ? 0 : tt === "tucked" ? -2 : 4;
    if (bottom.type === "pants" || bottom.type === "shorts") {
      // waistband under shirt hem
      torso += path(`M${n(-B.tb + 2)} ${n(B.hy - 6)} L${n(B.tb - 2)} ${n(B.hy - 6)} L${n(B.hw + legW / 2 + 2)} ${n(B.hy + 14)} L0 ${n(B.hy + 22)} L${n(-B.hw - legW / 2 - 2)} ${n(B.hy + 14)} Z`, pantsC, { sw: 2.4 });
    }
    const tp = torsoPath(B, flare, drop);
    torso += path(tp, topC, { sw: 3 });
    // cel shade on the back side
    torso += `<path d="M${n(-B.sw - 5)} ${n(B.sy + 14)} L${n(-B.tb - 1)} ${n(B.hy + drop + 2)} L${n(-B.tb + 12)} ${n(B.hy + drop + 6)} L${n(-B.sw + 8)} ${n(B.sy + 10)} Z" fill="${shade(topC, -0.18)}" opacity=".85"/>`;
    const neckY = B.sy - 6;
    if (tt === "hoodie") {
      torso += path(`M${n(-B.tb - 4)} ${n(B.hy + drop - 6)} L${n(B.tb + 4)} ${n(B.hy + drop - 6)}`, "none", { sw: 2.2 });
      torso += path(`M${n(-B.tb * 0.62)} ${n(B.hy - 28)} L${n(B.tb * 0.62)} ${n(B.hy - 28)} L${n(B.tb * 0.82)} ${n(B.hy + drop - 8)} L${n(-B.tb * 0.82)} ${n(B.hy + drop - 8)} Z`, shade(topC, -0.08), { sw: 2.4 });
      afterTorso += path(`M${n(-B.sw + 4)} ${n(neckY + 4)} Q0 ${n(neckY + 24)} ${n(B.sw - 4)} ${n(neckY + 4)} Q${n(B.sw - 2)} ${n(neckY - 14)} 0 ${n(neckY - 12)} Q${n(-B.sw + 2)} ${n(neckY - 14)} ${n(-B.sw + 4)} ${n(neckY + 4)} Z`, shade(topC, -0.12), { sw: 2.6 });
      afterTorso += line(-7 * k, neckY + 12, -9 * k, neckY + 44, { sw: 2 }) + line(7 * k, neckY + 12, 9 * k, neckY + 44, { sw: 2 });
      afterTorso += fcircle(-9 * k, neckY + 46, 2.6, "#fff") + fcircle(9 * k, neckY + 46, 2.6, "#fff");
    } else if (tt === "tee" || tt === "pjs") {
      afterTorso += path(`M${n(-11 * k)} ${n(neckY + 2)} Q0 ${n(neckY + 14)} ${n(11 * k)} ${n(neckY + 2)}`, shade(topC, -0.15), { sw: 2.4 });
      if (tt === "pjs") {
        for (let i = -2; i <= 2; i++) torso += line(i * B.tb * 0.38, B.sy + 4, i * B.tb * 0.42, B.hy + drop, { sw: 3, stroke: "#fff", op: 0.55 });
        torso += [0.3, 0.5, 0.7].map((fy) => circle(4, B.sy + (B.hy - B.sy) * fy, 2.6, "#fff", { sw: 1.4 })).join("");
      }
    } else if (tt === "polo" || tt === "shirtTie" || tt === "tucked" || tt === "suit") {
      const collarC = tt === "suit" ? "#ffffff" : top.collar || shade(topC, 0.15);
      if (tt === "suit") {
        torso += path(`M${n(-12 * k)} ${n(neckY)} L0 ${n(B.sy + 50 * k)} L${n(12 * k)} ${n(neckY)} Z`, "#fff", { sw: 2.2 });
      }
      if (tt === "shirtTie" || tt === "suit") {
        const tie = top.tie || "#2c4a9a";
        torso += path(`M${n(-5 * k)} ${n(neckY + 6)} L${n(5 * k)} ${n(neckY + 6)} L${n(4 * k)} ${n(neckY + 14)} L${n(-4 * k)} ${n(neckY + 14)} Z`, tie, { sw: 2 });
        torso += path(`M${n(-4 * k)} ${n(neckY + 14)} L${n(4 * k)} ${n(neckY + 14)} L${n(8 * k)} ${n(B.hy - 22)} L0 ${n(B.hy - 12)} L${n(-8 * k)} ${n(B.hy - 22)} Z`, tie, { sw: 2.2 });
        torso += line(-6 * k, neckY + 40, 6 * k, neckY + 32, { sw: 2, stroke: shade(tie, 0.35) });
      } else {
        torso += line(0, neckY + 10, 0, neckY + 46, { sw: 2 });
        torso += fcircle(2, neckY + 20, 2.2, INK) + fcircle(2, neckY + 34, 2.2, INK);
      }
      if (tt === "suit") {
        torso += path(`M${n(-12 * k)} ${n(neckY)} L${n(-2 * k)} ${n(B.sy + 54 * k)} L${n(-22 * k)} ${n(B.sy + 20 * k)} Z`, shade(topC, -0.12), { sw: 2.2 });
        torso += path(`M${n(12 * k)} ${n(neckY)} L${n(2 * k)} ${n(B.sy + 54 * k)} L${n(22 * k)} ${n(B.sy + 20 * k)} Z`, shade(topC, -0.12), { sw: 2.2 });
        torso += fcircle(0, B.sy + 66 * k, 2.6, INK) + fcircle(0, B.sy + 80 * k, 2.6, INK);
      }
      afterTorso += path(`M${n(-2)} ${n(neckY + 8)} L${n(-15 * k)} ${n(neckY - 4)} L${n(-17 * k)} ${n(neckY + 12)} Z`, collarC, { sw: 2.2 });
      afterTorso += path(`M${n(2)} ${n(neckY + 8)} L${n(15 * k)} ${n(neckY - 4)} L${n(17 * k)} ${n(neckY + 12)} Z`, collarC, { sw: 2.2 });

      }

      if (top.necklace) torso += path(`M${n(-10 * k)} ${n(neckY + 2)} Q0 ${n(neckY + 20)} ${n(10 * k)} ${n(neckY + 2)}`, "none", { sw: 1.8, stroke: "#d8b84a" }) + `<path d="M0 ${n(neckY + 12)} v10 M-4 ${n(neckY + 16)} h8" stroke="#d8b84a" stroke-width="2"/>`;
    } else if (tt === "dress") {
      afterTorso += path(`M${n(-11 * k)} ${n(neckY + 2)} Q0 ${n(neckY + 16)} ${n(11 * k)} ${n(neckY + 2)}`, shade(topC, -0.15), { sw: 2.4 });
      if (top.necklace) afterTorso += path(`M${n(-10 * k)} ${n(neckY + 6)} Q0 ${n(neckY + 22)} ${n(10 * k)} ${n(neckY + 6)}`, "none", { sw: 2, stroke: "#f6f0e6" });
    } else if (tt === "vest") {
      torso += path(`M${n(-14 * k)} ${n(neckY)} L${n(14 * k)} ${n(neckY)} L${n(6 * k)} ${n(B.hy + drop)} L${n(-6 * k)} ${n(B.hy + drop)} Z`, top.inner || "#ffffff", { sw: 2.2 });
    }
    if (top.emblem) torso += gear(B.tb * 0.3 + 4, B.sy + 38 * k, 11 * k, top.emblem);
    if (top.apron) {
      const ap = top.apron;
      torso += path(`M${n(-B.tb * 0.7)} ${n(B.sy + 22)} L${n(B.tb * 0.7)} ${n(B.sy + 22)} L${n(B.tb * 0.92)} ${n(B.hy + 26)} L${n(-B.tb * 0.92)} ${n(B.hy + 26)} Z`, ap, { sw: 2.6 });

    // head
    const hairFn = HAIR[(cfg.hair && cfg.hair.style) || "crop"] || HAIR.crop;

    let head = hair.back;

      hc = B.hcy;
    // ears
    [-1, 1].forEach((side) => {

    head += path(headPath(r, hc, cfg.jaw || 1), skin, { sw: 3 });

    head += `<path d="M${n(-0.92 * r)} ${n(hc + 0.1 * r)} C${n(-0.9 * r)} ${n(hc + 0.6 * r)} ${n(-0.55 * r)} ${n(hc + 0.98 * r)} ${n(-0.1 * r)} ${n(hc + 1.02 * r)} C${n(-0.5 * r)} ${n(hc + 0.8 * r)} ${n(-0.75 * r)} ${n(hc + 0.5 * r)} ${n(-0.92 * r)} ${n(hc + 0.1 * r)} Z" fill="${skinShade}" opacity=".7"/>`;
    if (cfg.beard) head += beard(B, cfg.beard, cfg);
    head += face(B, cfg, ex, o);
    if (cfg.mustache) head += mustache(B, cfg.mustache);
    head += hair.front;
    if (cfg.glasses) head += glasses(B, cfg.glasses === true ? null : cfg.glasses);
    if (o.goggles) {
      const gy2 = hc - 0.62 * r;
      head += path(`M${n(-1.02 * r)} ${n(gy2 + 4)} Q0 ${n(gy2 - 10)} ${n(1.02 * r)} ${n(gy2 + 4)}`, "none", { sw: 7 }) + path(`M${n(-1.02 * r)} ${n(gy2 + 4)} Q0 ${n(gy2 - 10)} ${n(1.02 * r)} ${n(gy2 + 4)}`, "none", { sw: 4, stroke: "#5a5a6e" });
      [-0.32, 0.38].forEach((fx2) => (head += circle(fx2 * r, gy2 - 2, 0.27 * r, "#9fe0ff", { sw: 3 }) + circle(fx2 * r - 3, gy2 - 6, 0.08 * r, "#ffffff", { sw: 0 })));
    }
    if (o.cap) head += o.cap;

    const headTf = `translate(${n(o.headDx || 0)} ${n(o.headDy || 0)}) rotate(${o.headTilt || 0} 0 ${n(B.sy - 14)})`;
    up += arms.back + neck + torso + afterTorso;
    up += arms.mid;
    up += `<g transform="${headTf}">${head}</g>`;
    up += arms.front;

    const upperTf = `translate(0 ${n(bodyDy)}) rotate(${o.lean || 0} 0 ${n(B.hy)})`;
    // skirt sits over the legs but under the torso; sitting on the floor puts the knees in front

      ? skirt + `<g transform="${upperTf}">${up.replace(arms.mid, "")}</g>` + legs + `<g transform="${upperTf}">${arms.mid}</g>`
      : legs + skirt + `<g transform="${upperTf}">${up}</g>`;

    // world-space extras
    const W = (lx, ly) => {
      // apply lean + bodyDy roughly

      const yy = ly - B.hy;
      const rx2 = lx * Math.cos(a) - yy * Math.sin(a),
        ry2 = lx * Math.sin(a) + yy * Math.cos(a) + B.hy + bodyDy;

    if ((ex.extras || []).includes("sweat")) fx += C.fx.sweat(headC[0] + f * r * 0.9 * s, headC[1] - r * 0.5 * s, s);
    if ((ex.extras || []).includes("vein")) fx += C.fx.vein(headC[0] - f * r * 0.55 * s, headC[1] - r * 0.75 * s, s);
    if ((ex.extras || []).includes("zz")) fx += C.fx.zz(headTop[0] + f * 40 * s, headTop[1], s);

    let items = "";
    const handW = (side) => {
      const A = hands[side];
      const h = A[2];
      const dx = A[2][0] - A[1][0],
        dy = A[2][1] - A[1][1],
        L = Math.hypot(dx, dy) || 1;
      return W(h[0] + (dx / L) * B.hand * 0.5, h[1] + (dy / L) * B.hand * 0.5);
    };
    if (o.hold) {
      ["l", "r"].forEach((key) => {
        const fn = o.hold[key];
        if (!fn) return;
        const p = handW(key === "l" ? -1 : 1);
        items += fn(p[0], p[1], s, f);
      });
      if (o.hold.c) {
        // carried with both hands: centre the item between them
        const a = handW(-1),
          b = handW(1);
        items += o.hold.c((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, s, f);
      }
    }
    const tf = `translate(${n(x)} ${n(y)}) scale(${n(f * s)} ${n(s)})${o.rot ? ` rotate(${o.rot} 0 -100)` : ""}`;
    let main = `<g transform="${tf}">${body}</g>`;
    if (o.holdBehind) main = items + main;
    else main = main + items;
    if (o.handsOver && o.hold) {
      // redraw hands above held items
      let hs = "";
      [-1, 1].forEach((side) => {
        const A = hands[side];
        const ug = `<g transform="${upperTf}">${handShape(A[2], A[1], B.hand, skin, side < 0 ? handL : handR)}</g>`;
        hs += ug;
      });
      main += `<g transform="${tf}">${hs}</g>`;
    }
    return main + fx;
  }
  C.person = person;

  // ---------- poses ----------
  const ik = (x, y, extra) => Object.assign({ x, y }, extra || {});
  C.ik = ik;
  C.POSES = {
    stand: (B) => ({ la: [9, -6], ra: [9, -6], ll: [3, 0], rl: [3, 0] }),
    relax: (B) => ({ la: [5, -2], ra: [5, -2], ll: [4, 0], rl: [4, 0] }),

    pray: (B) => ({ la: ik(4, B.sy + (B.hy - B.sy) * 0.3), ra: ik(4, B.sy + (B.hy - B.sy) * 0.3), ll: [3, 0], rl: [3, 0], handL: "pray", handR: "pray" }),
    point: (B) => ({ la: [9, -6], ra: [96, -4], ll: [5, 0], rl: [5, 0], handR: "point" }),
    pointUp: (B) => ({ la: ik(B.tb + 2, B.hy - 2), ra: [168, 8], ll: [5, 0], rl: [5, 0], handR: "point", handL: "fist" }),
    yell: (B) => ({ la: ik(B.tb + 2, B.hy - 2), ra: [100, -12], ll: [7, 0], rl: [7, 0], handR: "point", handL: "fist" }),
    shrug: (B) => ({ la: [40, 75], ra: [40, 75], ll: [4, 0], rl: [4, 0] }),

    facepalm: (B) => ({ la: [9, -6], ra: Object.assign(ik(B.r * 0.05, B.hcy - B.r * 0.05, { pref: [0.6, 1] }), { layer: "front" }), ll: [3, 0], rl: [3, 0] }),
    holdBoth: (B) => ({ la: ik(8, B.sy + (B.hy - B.sy) * 0.5), ra: ik(8, B.sy + (B.hy - B.sy) * 0.5), ll: [3, 0], rl: [3, 0] }),
    holdOut: (B) => ({ la: [9, -6], ra: ik(B.sw + B.ua * 0.9, B.sy + B.ua * 0.6), ll: [4, 0], rl: [4, 0] }),
    present: (B) => ({ la: ik(B.sw + B.ua * 0.75, B.sy + B.ua * 0.75), ra: ik(B.sw + B.ua * 0.75, B.sy + B.ua * 0.75), ll: [5, 0], rl: [5, 0] }),

  P.cashBox = (x, y, s) => T(x, y, s, `${rect(-50, -40, 100, 40, "#3f8f5a", { sw: 3, r: 4 })}${path("M-50 -40 L-40 -70 L60 -70 L50 -40 Z", "#4fa86a", { sw: 3 })}${C.held.money(0, -48, 0.9, 1)}${rect(-8, -26, 16, 10, "#d8b84a", { sw: 2 })}`);
  P.pew = (x, y, w, o = {}) => {

  P.stainedGlass = (x, y, w, h) => {

    i += circle(x + w / 2, y + w * 0.38, w * 0.22, "#f4c542", { sw: 2.4 });

    const hx = 44,
      hy = by - 26;
    i += circle(hx, hy, 24, c, { sw: 3 });
    i += ellipse(hx + 22, hy + 8, 16, 11, "#f6e6c8", { sw: 2.6 });
    i += fellipse(hx + 36, hy + 2, 6, 5, INK);
    i += path(`M${hx - 14} ${hy - 18} Q${hx - 34} ${hy - 6} ${hx - 26} ${hy + 22} Q${hx - 12} ${hy + 12} ${hx - 6} ${hy - 12} Z`, dk, { sw: 2.6 });

    } else if (mood === "gross") {
      i += path(`M${hx} ${hy - 10} l10 10 M${hx + 10} ${hy - 10} l-10 10`, "none", { sw: 2.6 });

      if (mood === "love") i += fx.heart(hx + 10, hy - 46, 10) + fx.heart(hx + 34, hy - 58, 7);
    }
    i += rect(-8 + hx - 30, by - 22, 16, 8, "#c9473c", { sw: 2, r: 3 });

})();

/* Lexington: The Turnaround — backgrounds.
   Every room has fixed "room coordinates" (origin = centre of the back wall at
   floor level, same scale as the characters). A panel frames part of a room with
   { k: scale, gy: floor line in panel px, ox: panel x of the room origin }. */
(function () {
  "use strict";
  const C = window.Comic;
  const { n, rect, frect, path, line, circle, ellipse, text, fcircle, fellipse, shade, INK } = C;
  const P = C.prop,
    fx = C.fx;
  const S = (C.scene = {});

  // place helper: room coords -> panel coords
  function rig(o, w, h) {
    const k = o.k || 1,
      gy = o.gy != null ? o.gy : h * 0.86,
      ox = o.ox != null ? o.ox : w / 2;
    return { k, gy, ox, X: (rx) => ox + rx * k, Y: (ry) => gy + ry * k };
  }

  function walls(w, h, gy, wall, floor, o = {}) {
    let s = frect(0, 0, w, gy, wall);
    if (o.wallPattern) s += `<rect x="0" y="0" width="${n(w)}" height="${n(gy)}" fill="${o.wallPattern}"/>`;
    if (o.stripe) s += frect(0, gy * 0.55, w, 6, shade(wall, -0.08));
    s += frect(0, gy, w, h - gy, floor);
    s += frect(0, gy - 8, w, 10, o.base || shade(wall, -0.25)) + line(0, gy - 8, w, gy - 8, { sw: 2 }) + line(0, gy + 2, w, gy + 2, { sw: 2.4 });
    return s;
  }
  S.walls = walls;

  function nightShade(w, h, op) {
    return `<rect x="0" y="0" width="${n(w)}" height="${n(h)}" fill="#141a44" opacity="${op || 0.55}"/>`;
  }
  S.night = nightShade;

  S.color = (w, h, c, pattern) => frect(0, 0, w, h, c) + (pattern ? `<rect width="${n(w)}" height="${n(h)}" fill="url(#${pattern})"/>` : "");
  S.burst = (w, h, c1, c2, cx, cy) => frect(0, 0, w, h, c1) + fx.focus(w, h, cx ?? w / 2, cy ?? h / 2, c2, 70, Math.min(w, h) * 0.18);
  S.rays = (w, h, c1, c2, cx, cy) => frect(0, 0, w, h, c1) + fx.rays(cx ?? w / 2, cy ?? h / 2, Math.hypot(w, h), c2, 22, 0.55);
  S.sky = (w, h, time) => {
    const id = { day: "skyDay", night: "skyNight", dusk: "skyDusk", dawn: "skyDawn", sunset: "skySunset" }[time || "day"];
    return `<rect width="${n(w)}" height="${n(h)}" fill="url(#${id})"/>`;
  };

  // ---------- bedroom ----------
  S.bedroom = (w, h, o = {}) => {
    const { k, gy, X, Y } = rig(o, w, h);
    const messy = !!o.messy;
    let s = walls(w, h, gy, messy ? "#a9b4c9" : "#b8d7d0", messy ? "#7d7f99" : "url(#carpet)", { stripe: true });
    if (!messy) s += frect(0, gy, w, h - gy, "#7d8fb3") + `<rect x="0" y="${n(gy)}" width="${n(w)}" height="${n(h - gy)}" fill="url(#carpet)"/>`;
    // door
    s += P.door(X(-600), Y(-270), 120 * k, 270 * k, { color: "#b07a4a" });
    // window
    s += P.window(X(-85), Y(-345), 170 * k, 170 * k, { time: o.time || "day", curtains: messy ? "#7a6a9a" : "#e8c35a" });
    // posters
    s += P.poster(X(-270), Y(-330), 80 * k, 110 * k, "robot", messy ? -6 : 0);
    s += P.poster(X(150), Y(-335), 84 * k, 112 * k, messy ? "game" : "verse", messy ? 5 : 0);
    // desk area
    s += P.shelf(X(-470), Y(-300), 230 * k, { messy, trophy: !messy, seed: 8 });
    s += P.desk(X(-360), Y(0), k);
    s += P.monitor(X(-385), Y(-112), k, o.monitor || { code: !messy, game: messy });
    s += P.lamp(X(-285), Y(-112), k, { on: o.time === "night" || o.lamp });
    if (!o.noChair) s += P.chair(X(-330), Y(4), k, { color: "#c9473c" });
    if (!messy && o.goalBoard) s += P.goalBoard(X(270), Y(-360), 190 * k, 200 * k, { goals: o.goalBoard });
    // bed
    if (!o.noBed) s += P.bed(X(400), Y(0), k, { messy, blanket: "#3f6fb5" });
    if (o.robot) s += P.robot(X(-140), Y(2), k * 0.9, { sparks: o.robotSparks });
    if (messy) {
      s += P.clothesPile(X(-60), Y(10), k);
      s += P.clothesPile(X(170), Y(16), k * 0.8, { colors: ["#5b7fb5", "#ffffff", "#c9473c", "#f4c542", "#7cc35a"] });
      s += P.pizzaBox(X(-230), Y(18), k);
      s += P.can(X(60), Y(24), k, 80) + P.can(X(250), Y(8), k, 0) + P.can(X(-280), Y(-112), k, 0);
      s += P.sock(X(-300), Y(-130), k, 160) + P.sock(X(110), Y(30), k, -70);
      s += P.plateMold(X(300), Y(20), k);
      if (o.flies !== false) s += fx.flies(X(-40), Y(-120), k, 3);
    } else {
      s += P.plant(X(-130), Y(4), k * 0.9);
      s += `<ellipse cx="${n(X(60))}" cy="${n(Y(40))}" rx="${n(150 * k)}" ry="${n(22 * k)}" fill="#e09a3e" stroke="${INK}" stroke-width="2.6"/>`;
    }
    if (o.time === "night") {
      s += nightShade(w, h, 0.5);
      // moonbeam from the window
      s += `<path d="M${n(X(-85))} ${n(Y(-345))} L${n(X(85))} ${n(Y(-345))} L${n(X(260))} ${n(Y(60))} L${n(X(-40))} ${n(Y(60))} Z" fill="#cfe0ff" opacity=".18"/>`;
    }
    return s;
  };

  // ---------- bathroom ----------
  S.bathroom = (w, h, o = {}) => {
    const { k, gy, X, Y } = rig(o, w, h);
    let s = frect(0, 0, w, gy, "#dff0f3") + `<rect width="${n(w)}" height="${n(gy)}" fill="url(#tiles)"/>`;
    s += frect(0, gy, w, h - gy, "#c9d3e0") + line(0, gy, w, gy, { sw: 3 });
    for (let x = 0; x < w; x += 46 * k) s += line(x, gy, x - 40 * k, h, { sw: 1.4, stroke: "#a9b3c4" });
    s += P.mirror(X(-95), Y(-360), 190 * k, 150 * k);
    if (o.reflect) s += `<g clip-path="none">${o.reflect}</g>`;
    s += P.sink(X(0), Y(0), k, { running: o.running });
    s += P.showerCurtain(X(170), Y(-380), 260 * k, 380 * k, { color: "#8fd0c9", ducks: true });
    s += P.toilet(X(-300), Y(0), k);
    s += P.tp(X(-200), Y(-120), k);
    s += P.towelRack(X(-470), Y(-260), 90 * k, "#f4c542");

    return s;

  // ---------- kitchen ----------
  S.kitchen = (w, h, o = {}) => {
    const { k, gy, X, Y } = rig(o, w, h);
    let s = walls(w, h, gy, "#f3dfb5", "url(#planks)", { stripe: false });
    s += `<rect x="0" y="${n(gy)}" width="${n(w)}" height="${n(h - gy)}" fill="#b9814f"/><rect x="0" y="${n(gy)}" width="${n(w)}" height="${n(h - gy)}" fill="url(#planks)"/>`;
    s += P.cabinets(X(-560), Y(-380), 470 * k, 110 * k, { color: "#5f8f8a" });
    s += P.window(X(-410), Y(-250), 160 * k, 110 * k, { time: o.time === "night" ? "night" : "day", curtains: null });
    s += P.counter(X(-560), Y(-120), 470 * k, { color: "#5f8f8a" });
    s += `<g transform="translate(${n(X(-330))} ${n(Y(-120))}) scale(${n(k)})">${ellipse(0, 4, 50, 8, "#c9d3e0", { sw: 2.4 })}${path("M-6 0 L-6 -24 Q-6 -32 6 -32 L20 -32 L20 -24 L8 -24 L8 0", "#c9d3e0", { sw: 2.4 })}</g>`;
    s += P.fridge(X(20), Y(0), k);
    if (o.chart) s += P.choreChart(X(110), Y(-330), 170 * k, 140 * k, o.chart);
    s += P.frame(X(320), Y(-330), 120 * k, 90 * k, "verse");
