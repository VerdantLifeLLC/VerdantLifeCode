    if (o.time === "night") s += nightShade(w, h, 0.42) + `<ellipse cx="${n(X(260))}" cy="${n(Y(-230))}" rx="${n(260 * k)}" ry="${n(200 * k)}" fill="url(#lampGlow)" opacity=".7"/>` + line(X(260), 0, X(260), Y(-330), { sw: 2 }) + path(`M${n(X(220))} ${n(Y(-330))} L${n(X(300))} ${n(Y(-330))} L${n(X(280))} ${n(Y(-370))} L${n(X(240))} ${n(Y(-370))} Z`, "#f4c542", { sw: 2.4 });
    return s;
  };

  // ---------- living room ----------
  S.living = (w, h, o = {}) => {
    const { k, gy, X, Y } = rig(o, w, h);
    let s = walls(w, h, gy, o.wall || "#e6c9a8", "#b9814f", { stripe: true });
    s += `<rect x="0" y="${n(gy)}" width="${n(w)}" height="${n(h - gy)}" fill="url(#planks)"/>`;
    s += `<ellipse cx="${n(X(0))}" cy="${n(Y(40))}" rx="${n(300 * k)}" ry="${n(34 * k)}" fill="#c9473c" stroke="${INK}" stroke-width="2.6"/>`;
    s += P.frame(X(-140), Y(-360), 90 * k, 70 * k, "family") + P.frame(X(-20), Y(-380), 60 * k, 90 * k, "cross") + P.frame(X(70), Y(-355), 80 * k, 60 * k, "family");
    s += P.window(X(300), Y(-330), 150 * k, 170 * k, { time: o.time || "day", curtains: "#e8c35a" });
    s += P.floorLamp(X(-250), Y(0), k, { on: o.time === "night" });
    if (o.couch !== false) s += P.couch(X(0), Y(0), k, { color: "#6f8fd6", pillow: true });
    if (o.tvGlow) s += `<rect width="${n(w)}" height="${n(h)}" fill="#2a3a7a" opacity=".38"/><ellipse cx="${n(o.tvGlow[0])}" cy="${n(o.tvGlow[1])}" rx="${n(w * 0.55)}" ry="${n(h * 0.5)}" fill="url(#screenGlow)" opacity=".55"/>`;
    if (o.time === "night" && !o.tvGlow) s += nightShade(w, h, 0.4);
    return s;
  };

  // ---------- hallway / stairs ----------
  S.hall = (w, h, o = {}) => {
    const { k, gy, X, Y } = rig(o, w, h);
    let s = walls(w, h, gy, "#d8c8e6", "#b9814f", { stripe: true });
    s += `<rect x="0" y="${n(gy)}" width="${n(w)}" height="${n(h - gy)}" fill="url(#planks)"/>`;
    s += P.frame(X(-260), Y(-330), 80 * k, 100 * k, "family") + P.frame(X(-150), Y(-310), 60 * k, 80 * k, "cross");
    s += P.stairs(X(-40), Y(0), 420 * k, 400 * k, { steps: 9 });
    if (o.door) s += P.door(X(-460), Y(-270), 120 * k, 270 * k, { color: "#c9473c" });
    if (o.time === "night") s += nightShade(w, h, 0.45);
    return s;
  };

  // ---------- church ----------
  S.church = (w, h, o = {}) => {
    const { k, gy, X, Y } = rig(o, w, h);
    let s = walls(w, h, gy, "#efe2c8", "#9a3a3a", { stripe: false, base: "#8a5a3c" });
    s += frect(0, gy - 140 * k, w, 140 * k, "#c9a77a") + line(0, gy - 140 * k, w, gy - 140 * k, { sw: 2.6 });
    for (let x = X(-1200); x < w; x += 70 * k) s += line(x, gy - 140 * k, x, gy - 8, { sw: 1.6, stroke: "#a8865a" });
    [-430, -230, 230, 430].forEach((rx) => (s += P.stainedGlass(X(rx - 55), Y(-470), 110 * k, 260 * k)));
    s += `<ellipse cx="${n(X(0))}" cy="${n(Y(-320))}" rx="${n(200 * k)}" ry="${n(200 * k)}" fill="url(#glow)" opacity=".7"/>`;
    s += P.cross(X(0), Y(-180), k * 1.15, "#8a5a3c");
    if (o.pulpit !== false) s += P.pulpit(X(o.pulpitX ?? 0), Y(0), k);
    if (o.light) s += `<rect width="${n(w)}" height="${n(h)}" fill="#fff3c8" opacity=".14"/>`;
    return s;
  };
  S.pews = (w, h, o = {}) => {
    // rows of pews filling the panel bottom (for congregation shots); returns front layer only
    const { k, gy, X } = rig(o, w, h);
    return P.pew(X(-700), gy, 1400 * k, { bible: true });
  };

  // ---------- school ----------
  S.school = (w, h, o = {}) => {
    const { k, gy, X, Y } = rig(o, w, h);

    s += rect(X(-330), Y(-165), 560 * k, 10 * k, "#b07a4a", { sw: 2 });
    const eq = o.board || ["x² + 5x + 6 = 0", "(x + 2)(x + 3) = 0", "x = -2, -3  ✓"];

    s += circle(X(420), Y(-390), 26 * k, "#ffffff", { sw: 3 }) + line(X(420), Y(-390), X(420), Y(-406), { sw: 2.4 }) + line(X(420), Y(-390), X(432), Y(-384), { sw: 2.4 });
    return s;
  };
  S.schoolDesk = (x, y, k) =>
    `<g transform="translate(${n(x)} ${n(y)}) scale(${n(k)})">${rect(-90, -110, 180, 14, "#c9a77a", { sw: 3, r: 3 })}${line(-70, -96, -70, 0, { sw: 6 })}${line(70, -96, 70, 0, { sw: 6 })}${rect(-80, -96, 160, 18, "#9aa3b5", { sw: 2.4 })}</g>`;

  // ---------- exterior ----------
  S.yard = (w, h, o = {}) => {
    const { k, gy, X, Y } = rig(o, w, h);
    const time = o.time || "day";
    let s = S.sky(w, gy, time);
    if (time === "day") s += P.sun(X(420), Y(-470), 40 * k) + P.cloud(X(-300), Y(-480), k) + P.cloud(X(150), Y(-520), k * 0.7);
    if (time === "sunset") s += P.sun(X(380), Y(-160), 70 * k);
    if (time === "night") [[0.1, 0.1], [0.3, 0.25], [0.6, 0.12], [0.85, 0.3], [0.45, 0.4]].forEach(([a, b]) => (s += fx.sparkle(w * a, gy * b, 6, "#fff8dc")));
    // distant houses
    s += `<path d="M0 ${n(gy - 120 * k)} L${n(w * 0.15)} ${n(gy - 160 * k)} L${n(w * 0.3)} ${n(gy - 120 * k)} L${n(w * 0.5)} ${n(gy - 150 * k)} L${n(w * 0.75)} ${n(gy - 110 * k)} L${n(w)} ${n(gy - 140 * k)} L${n(w)} ${n(gy)} L0 ${n(gy)} Z" fill="${time === "night" ? "#1d2350" : time === "sunset" ? "#c96a6a" : "#9fc6a5"}" opacity=".7"/>`;
    s += frect(0, gy, w, h - gy, "#69a94f") + `<rect x="0" y="${n(gy)}" width="${n(w)}" height="${n(h - gy)}" fill="url(#grass)"/>` + line(0, gy, w, gy, { sw: 3 });

    const { k, gy, X, Y } = rig(o, w, h);

    for (let x = 0; x < w; x += 60 * k) s += line(x, gy, x, h, { sw: 1.6, stroke: "#9a8670" });

  };

  // ---------- garage workshop ----------
  S.garage = (w, h, o = {}) => {
    const { k, gy, X, Y } = rig(o, w, h);

    s += P.workbench(X(-520), Y(0), 340 * k);
    s += P.shelf(X(140), Y(-360), 220 * k, { seed: 3, books: 0 });

    }
    return s;
  };

  S.bank = (w, h, o = {}) => {
    const { k, gy, X, Y } = rig(o, w, h);
    let s = walls(w, h, gy, "#e8e4f0", "#c9c3b5", { stripe: true, base: "#7a5a8a" });
    s += P.sign(X(-260), Y(-460), 520 * k, 80 * k, "FIRST HOMETOWN BANK", "Savings • Checking • Youth Accounts", { size: 30 * k, color: "#7a5a8a" });
    s += P.plant(X(-420), Y(0), k);
    return s;
  };

  S.expo = (w, h, o = {}) => {
    const { k, gy, X, Y } = rig(o, w, h);
    let s = walls(w, h, gy, "#2b3a73", "#3a3f5a", { stripe: false, base: "#1d2350" });
    s += fx.rays(X(0), Y(-500), Math.hypot(w, h), "#3a4a8a", 20, 0.6);
    s += rect(X(-380), Y(-470), 760 * k, 80 * k, "#f4c542", { sw: 3, r: 6 });
    s += text(X(0), Y(-418), "YOUTH BUSINESS EXPO", { size: 42 * k, font: "title", fill: "#c9473c", ls: 2 });
    [[-0.45, "#e8536b"], [0.45, "#4fb3e8"]].forEach(([fx2, c]) => (s += `<path d="M${n(X(fx2 * 900))} 0 L${n(X(fx2 * 900 - 60))} ${n(gy)} L${n(X(fx2 * 900 + 60))} ${n(gy)} Z" fill="${c}" opacity=".15"/>`));
    return s;
  };

  // crowd silhouettes along the bottom edge
  S.crowd = (w, h, y, o = {}) => {
    let s = "";
    const r = C.rng(o.seed || 12);
    const cols = o.colors || ["#2a2f45", "#3a3f5a", "#1f2338"];
    for (let x = -20; x < w + 40; x += 46 + r() * 20) {
      const hh = 30 + r() * 10;
      const c = cols[Math.floor(r() * cols.length)];
      s += `<ellipse cx="${n(x + 20)}" cy="${n(y + 40)}" rx="38" ry="40" fill="${c}"/><circle cx="${n(x + 20)}" cy="${n(y - hh * 0.2)}" r="${n(hh * 0.6)}" fill="${c}"/>`;

    }
    return s;
  };
})();

/* Lexington: The Turnaround — page layout and reader UI. */
(function () {
  "use strict";
  const C = window.Comic;
  const { n, INK } = C;
  const PW = 1000,
    PH = 1500,
    M = 34,
    G = 16,
    BANNER = 104;
  C.PAGE = { PW, PH, M, G };

  function layout(page) {

      const h = Math.round(H * rh);
      cols = cols || [1];
      const W = PW - 2 * M - G * (cols.length - 1);
      let x = M;
      cols.forEach((cf, i) => {
        const w = i === cols.length - 1 ? PW - M - x : Math.round(W * cf);
        rects.push({ x, y, w, h });
        x += w + G;
      });
      y += h + G;
    });
    return rects;
  }

  function banner(ch) {
    const y = M;
    let s = "";
    s += `<path d="M${M} ${y + 10} L${PW - M} ${y} L${PW - M - 12} ${y + 84} L${M + 8} ${y + 90} Z" fill="${ch.color || "#c9473c"}" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/>`;
    s += `<path d="M${M + 14} ${y + 18} L${PW - M - 14} ${y + 10}" stroke="#ffffff" stroke-width="3" opacity=".35"/>`;
    s += `<rect x="${M + 22}" y="${y + 18}" width="150" height="56" rx="6" fill="#ffd95e" stroke="${INK}" stroke-width="3" transform="rotate(-3 ${M + 97} ${y + 46})"/>`;
    s += C.text(M + 97, y + 41, "CHAPTER", { size: 18, font: "title", ls: 2, rot: -3 });
    s += C.text(M + 97, y + 68, String(ch.n), { size: 30, font: "title", rot: -3 });
    s += C.text(M + 200, y + 66, ch.title.toUpperCase(), { size: 50, font: "title", anchor: "start", fill: "#ffffff", stroke: INK, sw: 7, ls: 1.5 });
    return s;
  }

  function renderPanelInner(p, w, h) {
    let art = "";
    try {
      art = p.art ? p.art(w, h) : "";
    } catch (e) {
      console.error("panel art failed", e);
      art = C.text(w / 2, h / 2, "art error: " + e.message, { size: 14 });
    }
    const bl = typeof p.b === "function" ? p.b(w, h) : p.b || [];
    let balloons = "";
    bl.forEach((b) => {
      try {

    }

  }

    if (page.full) {
      s += page.full(PW, PH);
      if (page.b) (typeof page.b === "function" ? page.b(PW, PH) : page.b).forEach((b) => (s += C.balloon(b)));
    } else {
      if (page.chapter) s += banner(page.chapter);
      const rects = layout(page);
      page.panels.forEach((p, i) => {

    }
    if (num && !page.noNumber) s += C.text(PW / 2, PH - 18, String(num), { size: 18, font: "title", fill: "#6a6478" });

  }

  // ---------- reader UI ----------
  const state = { view: "pages" };
  function store(key, val) {
    try {
      if (val === undefined) return localStorage.getItem("lexington-comic:" + key);
      localStorage.setItem("lexington-comic:" + key, val);
    } catch (e) {
      return null;
    }
  }

  function render() {
    const book = document.getElementById("book");
    const pages = C.STORY;
    let html = "";
    let num = 0;
    pages.forEach((pg, i) => {
      num++;
      const anchor = pg.chapter ? ` id="ch${pg.chapter.n}"` : i === 0 ? ' id="cover"' : "";
      if (state.view === "pages" || pg.full) {
        html += `<section class="page${pg.full ? " full" : ""}"${anchor} data-page="${num}">${pageSvg(pg, i === 0 ? 0 : num)}</section>`;
      } else {
        const rects = layout(pg);
        html += `<section class="strip"${anchor} data-page="${num}">`;
        if (pg.chapter) html += `<h2 class="strip-title"><span>Chapter ${pg.chapter.n}</span>${C.esc(pg.chapter.title)}</h2>`;
        pg.panels.forEach((p, j) => {
          const r = rects[j];
          if (r) html += `<figure class="panel">${panelSvg(p, r, true)}</figure>`;
        });
        html += `</section>`;
      }
    });
    book.innerHTML = C.defs() + html;
    book.dataset.view = state.view;
  }

  function buildJump() {
    const sel = document.getElementById("jump");
    if (!sel) return;
    let opts = `<option value="cover">Cover</option>`;
    C.STORY.forEach((pg) => {
      if (pg.chapter) opts += `<option value="ch${pg.chapter.n}">${pg.chapter.n}. ${C.esc(pg.chapter.title)}</option>`;
    });
    opts += `<option value="extras">Then &amp; Now + Checklist</option>`;
    sel.innerHTML = opts;
    sel.addEventListener("change", () => {
      const el = sel.value === "extras" ? document.querySelector("[data-extras]") || document.querySelector(".page:last-child") : document.getElementById(sel.value);
      if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
    });
  }

  function buildLook() {
    const skinBox = document.getElementById("skin-swatches");
    const hairBox = document.getElementById("hair-swatches");
    if (!skinBox || !hairBox) return;
    const mk = (box, table, key, prop) => {
      box.innerHTML = Object.entries(table)
        .map(
          ([id, v]) =>
            `<button type="button" class="swatch" data-${key}="${id}" aria-pressed="${C.family[key] === id}" title="${v.label}" style="--sw:${v[prop]}"><span class="sr">${v.label}</span></button>`
        )
        .join("");
      box.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-" + key + "]");
        if (!b) return;
        C.family[key] = b.dataset[key];
        store(key, C.family[key]);
        box.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
        const y = window.scrollY;
        render();
        window.scrollTo(0, y);
      });
    };
    mk(skinBox, C.SKINS, "skin", "skin");
    mk(hairBox, C.HAIRS, "hair", "hair");
  }

  function buildView() {
    const group = document.getElementById("view-toggle");
    if (!group) return;
    group.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === state.view)));
    group.addEventListener("click", (e) => {
      const b = e.target.closest("button[data-view]");
      if (!b || b.dataset.view === state.view) return;
      state.view = b.dataset.view;
      store("view", state.view);
      group.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
      render();
    });
  }

  C.boot = function () {
    const params = new URLSearchParams(location.search);
    const skin = params.get("skin") || store("skin");
    const hair = params.get("hair") || store("hair");
    if (skin && C.SKINS[skin]) C.family.skin = skin;
    if (hair && C.HAIRS[hair]) C.family.hair = hair;
    const savedView = params.get("view") || store("view");
    state.view = savedView === "panels" || savedView === "pages" ? savedView : window.matchMedia("(max-width: 640px)").matches ? "panels" : "pages";
    if (params.has("print")) {
      state.view = "pages";
      document.documentElement.classList.add("print");
    }
    const go = () => {
      buildView();
      buildLook();
      buildJump();
      render();
      document.documentElement.classList.add("ready");
    };
    // Balloons are sized by measuring text, so the lettering fonts must be loaded first.
    let done = false;
    const once = () => {
      if (!done) {
        done = true;
        go();
      }
    };
    if (document.fonts && document.fonts.load) {
      Promise.all(
        ["700 20px 'Comic Neue'", "400 20px 'Comic Neue'", "20px 'Bangers'", "italic 500 20px 'Lora'", "500 20px 'Lora'", "20px 'Patrick Hand'"].map((f) =>
          document.fonts.load(f).catch(() => null)
        )
      ).then(once, once);
      setTimeout(once, 3500);
    } else once();
  };
  C.pageSvg = pageSvg;
  C.layout = layout;
})();

          let s = S.porch(w, h, { k: 0.85, gy, ox: w * 0.5, sunX: 420 });
          s += steps(w * 0.1, gy, w * 0.8, 3, (h - gy) / 3, "#b8a38a");
          s += lex({ x: w * 0.45, y: h + 40, s: 1.1, expr: "peace", pose: "sitHands", seated: true, ra: C.ik(110, -150) });
          s += npc("kid", { x: w * 0.58, y: h + 30, s: 1.05, f: -1, expr: "surprised", pose: "sitHands", seated: true });
          return s;
        },
        b: (w, h) => [
          say("Why would I even WANT to be in trouble? Life's too good now.", w * 0.2, 70, top("teen", w * 0.45, h + 40, 1.1, { seated: true, dx: -20 }), { w: 200 }),
          say("But how'd you DO it?", w * 0.7, 50, top("child", w * 0.58, h + 30, 1.05, { seated: true }), { w: 120 }),
          say("I prayed. I listened. I kept getting back up, day by day. God did the heavy lifting. I just stopped fighting Him.", w * 0.8, 180, top("teen", w * 0.45, h + 40, 1.1, { seated: true, dx: 30 }), { w: 230 }),
        ],
      },
    ],
  });

  page({
    rows: [
      [0.62, [1]],
      [0.38, [1]],
    ],
    panels: [
      {
        alt: "From the doorway, Mom and Dad hold each other and watch Lexington and Jace on the porch steps in the sunset.",
        art(w, h) {
          const gy = h * 0.55;
          let s = S.sky(w, h, "sunset") + P.sun(w * 0.15, h * 0.32, 70);
          s += `<rect x="${w * 0.42}" y="0" width="${w * 0.6}" height="${gy}" fill="url(#siding)" stroke="${INK}" stroke-width="3"/>`;
          s += rect(w * 0.5, gy - 380, 210, 380, "#2a1f2f", { sw: 4 }) + rect(w * 0.5 - 14, gy - 394, 238, 18, "#f6f1e6", { sw: 3 });
          s += `<rect x="${w * 0.5}" y="${gy - 380}" width="210" height="380" fill="#ffd27a" opacity=".55"/>`;
          s += mom({ x: w * 0.5 + 70, y: gy, s: 0.95, expr: "touched", pose: "heart" });
          s += dad({ x: w * 0.5 + 150, y: gy + 4, s: 0.95, f: -1, expr: "proud", pose: "stand", ra: C.ik(46, -258) });
          s += P.window(w * 0.82, gy - 330, 120, 140, { time: "sunset" });
          s += frect(0, gy, w, h - gy, "#b8a38a") + line(0, gy, w, gy, { sw: 3 });
          s += steps(w * 0.05, gy + 40, w * 0.5, 4, (h - gy - 40) / 4, "#b8a38a");
          s += rect(w * 0.42 - 14, 0, 22, gy, "#f6f1e6", { sw: 3 });
          s += lex({ x: w * 0.24, y: h * 0.99, s: 1.15, expr: "peace", pose: "sitHands", seated: true });
          s += npc("kid", { x: w * 0.4, y: h * 0.99, s: 1.1, f: -1, expr: "happy", pose: "sitHands", seated: true });
          s += P.dog(w * 0.62, h * 0.97, 1.1, { mood: "love", f: -1 });
          s += `<rect width="${w}" height="${h}" fill="#ff9a5a" opacity=".12"/>`;
          return s;
        },
        b: (w, h) => [
          say("That's our son.", w * 0.86, 90, top("man", w * 0.5 + 150, h * 0.55 + 4, 0.95, { dx: 10 }), { w: 120 }),
          say("God answered every single prayer.", w * 0.32, 90, top("woman", w * 0.5 + 70, h * 0.55, 0.95, { dx: -10 }), { w: 170 }),
        ],
      },
      {
        alt: "Lexington stands tall in the golden sunset with Biscuit beside him.",
        art(w, h) {
          let s = S.sky(w, h, "sunset") + fx.rays(w * 0.5, h * 0.7, 1200, "#fff3b8", 24, 0.5);
          s += `<path d="M0 ${h * 0.82} Q${w * 0.5} ${h * 0.68} ${w} ${h * 0.82} L${w} ${h} L0 ${h} Z" fill="#69a94f" stroke="${INK}" stroke-width="3"/>`;
          s += lex({ x: w * 0.5, y: h * 0.99, s: 1.4, expr: "confident", pose: "cheer", sparkle: true });
          s += P.dog(w * 0.64, h * 0.99, 1.0, { mood: "love", f: -1 });
          return s;
        },
        b: (w, h) => [
          verse("“Therefore if any man be in Christ, he is a new creature: old things are passed away; behold, all things are become new.” — 2 Corinthians 5:17", 16, 16, { w: 300 }),
          sfx("THE END", w * 0.82, h * 0.42, { size: 70, rot: -6, color: "#ffffff" }),
          sfx("...is just the beginning.", w * 0.8, h * 0.58, { size: 30, rot: -6, color: "#ffd95e", font: "hand" }),
        ],
      },
    ],
  });

  // =====================================================================
  // BACK PAGES
  // =====================================================================
  function statCard(x, y, w, h, o) {
    let s = `<rect x="${x + 8}" y="${y + 8}" width="${w}" height="${h}" rx="18" fill="${INK}"/>`;
    s += rect(x, y, w, h, "#ffffff", { sw: 5, r: 18 });
    s += `<path d="M${x} ${y + 18} Q${x} ${y} ${x + 18} ${y} L${x + w - 18} ${y} Q${x + w} ${y} ${x + w} ${y + 18} L${x + w} ${y + 70} L${x} ${y + 70} Z" fill="${o.color}" stroke="${INK}" stroke-width="5"/>`;
    s += text(x + w / 2, y + 52, o.title, { size: 46, font: "title", fill: "#ffffff", stroke: INK, sw: 6, ls: 2 });
    const ph = h * 0.5;
    s += `<svg x="${x + 16}" y="${y + 84}" width="${w - 32}" height="${ph}" viewBox="0 0 ${w - 32} ${ph}" overflow="hidden"><rect width="${w - 32}" height="${ph}" fill="${o.bg}"/><rect width="${w - 32}" height="${ph}" fill="url(#dots)"/>${o.art(w - 32, ph)}</svg>`;
    s += rect(x + 16, y + 84, w - 32, ph, "none", { sw: 3.5 });
    let ty = y + 84 + ph + 28;
    o.stats.forEach(([label, val, col]) => {
      s += text(x + 22, ty + 14, label, { size: 17, font: "title", anchor: "start", ls: 1 });
      for (let i = 0; i < 10; i++) s += rect(x + 160 + i * ((w - 190) / 10), ty, (w - 190) / 10 - 4, 18, i < val ? col : "#ece6da", { sw: 2, r: 3 });
      ty += 30;
    });
    return s;
  }
  page({
    noNumber: false,
    alt: "Then and Now: Lexington's stats before and after his turnaround, plus his favorite verses.",
    full(W, Hh) {
      let s = `<rect width="${W}" height="${Hh}" fill="#3f6fb5"/><rect width="${W}" height="${Hh}" fill="url(#dotsWhite)"/>`;
      s += text(W / 2 + 6, 120, "THEN & NOW", { size: 100, font: "title", fill: INK, stroke: INK, sw: 12, ls: 3 });
      s += text(W / 2, 114, "THEN & NOW", { size: 100, font: "title", fill: "#ffd95e", stroke: INK, sw: 8, ls: 3 });
      const stats = (v) => [
        ["BRAINS", v[0], "#2a8f86"],
        ["LISTENING", v[1], v[1] > 5 ? "#2a9d5a" : "#c9473c"],
        ["HYGIENE", v[2], v[2] > 5 ? "#2a9d5a" : "#c9473c"],
        ["FAITH", v[3], "#f0b429"],
        ["CONFIDENCE", v[4], "#f0b429"],
        ["TROUBLE", v[5], v[5] > 5 ? "#c9473c" : "#2a9d5a"],
      ];
      s += statCard(42, 160, 440, 760, { title: "THEN", color: "#7a7590", bg: "#d9d6e0", art: (w, h) => ghost(lex({ x: w / 2, y: h + 180, s: 1.5, messy: true, expr: "gloom", pose: "slump", flies: 3 }), 0.9), stats: stats([10, 2, 1, 3, 4, 10]) });
      s += statCard(518, 160, 440, 760, { title: "NOW", color: "#2a9d5a", bg: "#c9f2c0", art: (w, h) => lex({ x: w / 2, y: h + 180, s: 1.5, expr: "confident", pose: "hips", sparkle: true }), stats: stats([10, 10, 10, 9, 9, 0]) });
      s += rect(42, 960, 916, 470, "#fbf1d6", { sw: 5, r: 18 });
      s += text(W / 2, 1012, "LEXINGTON'S WORDS TO LIVE BY", { size: 38, font: "title", fill: "#c9473c", ls: 2 });
      const vv = [
        ["Ephesians 6:1", "Children, obey your parents in the Lord: for this is right."],
        ["Philippians 4:13", "I can do all things through Christ which strengtheneth me."],
        ["Galatians 6:9", "Let us not be weary in well doing: for in due season we shall reap."],
        ["Proverbs 3:5", "Trust in the LORD with all thine heart; and lean not unto thine own understanding."],
        ["1 Timothy 4:12", "Let no man despise thy youth; but be thou an example of the believers."],
        ["2 Corinthians 5:17", "If any man be in Christ, he is a new creature."],
      ];
      vv.forEach(([ref, t], i) => {
        const y = 1060 + i * 60;
        s += text(76, y, ref, { size: 22, font: "title", anchor: "start", fill: "#2a8f86", ls: 1 });
        s += text(76, y + 26, t, { size: 19, font: "verse", italic: true, anchor: "start", weight: 500 });
      });
      return s;
    },
  });

  page({
    noNumber: true,
    alt: "Lexington's Daily Checklist: a printable routine for mornings, the bathroom, after school and bedtime, with boxes for each day of the week.",
    full(W, Hh) {
      let s = `<rect width="${W}" height="${Hh}" fill="#fffaf0"/>`;
      s += `<rect width="${W}" height="150" fill="#2a8f86"/><rect width="${W}" height="150" fill="url(#dotsWhite)"/>` + line(0, 150, W, 150, { sw: 5 });
      s += text(W / 2 + 5, 86, "LEXINGTON'S DAILY CHECKLIST", { size: 58, font: "title", fill: INK, stroke: INK, sw: 9, ls: 2 });
      s += text(W / 2, 81, "LEXINGTON'S DAILY CHECKLIST", { size: 58, font: "title", fill: "#ffd95e", stroke: INK, sw: 6, ls: 2 });
      s += text(W / 2, 126, "Print it. Post it. Check it. Nobody has to remind you.", { size: 22, fill: "#ffffff" });
      const days = ["M", "T", "W", "T", "F", "S", "S"];
      const sections = [
        ["MORNING", "#e09a3e", ["Get up with the alarm", "Pray", "Brush teeth: 2 minutes", "Shower", "Deodorant", "Clean clothes + socks", "Make the bed"]],
        ["BATHROOM, EVERY TIME", "#3f6fb5", ["Go when you first feel it", "Wipe until the paper is clean", "Flush", "Wash hands: soap, 20 seconds"]],
        ["AFTER SCHOOL", "#3f8f5a", ["Homework first", "Chores: trash, dishes, laundry", "Feed Biscuit", "Business + hobby time"]],
        ["BEDTIME", "#7a3f8f", ["Read a Bible chapter", "Lay out tomorrow's clothes", "Brush teeth", "Pray + lights out"]],
      ];
      let y = 186;
      const gx = 560,
        cell = 43;
      s += days.map((d, i) => text(gx + i * cell + cell / 2, y + 4, d, { size: 24, font: "title" })).join("");
      y += 20;
      sections.forEach(([title, col, items]) => {
        s += rect(36, y, W - 72, 40, col, { sw: 3, r: 6 }) + text(54, y + 30, title, { size: 26, font: "title", anchor: "start", fill: "#ffffff", ls: 1.5 });
        y += 50;
        items.forEach((it) => {
          s += text(56, y + 30, it, { size: 23, font: "hand", anchor: "start", weight: 400 });
          for (let i = 0; i < 7; i++) s += rect(gx + i * cell + 7, y + 6, cell - 14, cell - 14, "#ffffff", { sw: 2.4, r: 5 });
          s += line(50, y + cell - 2, W - 50, y + cell - 2, { sw: 1, stroke: "#e2dccd" });
          y += cell;
        });
        y += 10;
      });
      s += lex({ x: 925, y: Hh - 12, s: 0.62, f: -1, expr: "grin", pose: "thumbs" });
      s += text(380, Hh - 40, "“I can do all things through Christ.” — Phil. 4:13", { size: 22, font: "verse", italic: true });
      return s;
    },
  });
})();
</script>
